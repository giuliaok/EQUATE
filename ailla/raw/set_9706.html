genous_description_language":null,"parent_folder":9166,"description":{"id":40762,"en":"HK-T-07_1.pdf - Qom demonstratives organized according to various affixes they may appear with.\u003cbr\u003eHK-T-10_5.pdf - Typewritten sheet listing Spanish words with English glosses and their Qom equivalents (marked for third-person singular possessor). The list is titled \"N prefixes\".\u003cbr\u003eHK-T-10_1.pdf - Sheet of a draft of a grammar.\u003cbr\u003eHK-T-05_15.pdf - Typewritten sheets listing Spanish words and their Qom equivalents (marked for third-person singular possessor). The list is titled \"Feminine Gender\".\u003cbr\u003eHK-T-10_3.pdf - Typewritten sheets listing Spanish words and their Qom equivalents (marked for third-person singular possessor). The list is titled \"Feminine Gender\". This document also contains notes on the underlying root of each Qom word.\u003cbr\u003eHK-T-05_16.pdf - Typewritten sheets listing Spanish words and their Qom equivalents (marked for third-person singular possessor). The list is titled \"Masculine Gender\".\u003cbr\u003eHK-T-10_2.pdf - Typewritten sheets listing Spanish words and their Qom equivalents (marked for third-person singular possessor). The list is titled \"Masculine Gender\". This document also contains notes on the underlying root of each Qom word.\u003cbr\u003eHK-T-10_4.pdf - Sheets of paper forming a large spreadsheet. On each row is a Spanish word and its Qom equivalent. Later columns note the appearance of each word with various suffixes. The sheet is titled \"Use of other plural forms\". This version of the document also contains additional notes.\u003cbr\u003eHK-T-05_11.pdf - Sheets of paper forming a large spreadsheet. On each row is a Spanish word and its Qom equivalent. Later columns note the appearance of each word with various suffixes. The sheet is titled \"Use of other plural forms\".\u003cbr\u003eHK-T-05_02.pdf - Looseleaf sheets featuring interlinearizations of Qom sentences. More information on these sentences may be found in their corresponding notebook pages, indicated in the upper left of each sheet.\u003cbr\u003eHK-T-05_13.pdf - List of Spanish words, their Qom equivalents, and their grammatical gender in Qom. The list is titled \"Use of qalotta\". Qalotta is a Qom word meaning, 'much, many'.\u003cbr\u003eHK-T-05_14.pdf - List of Spanish words, their Qom equivalents, and their grammatical gender in Qom. The list is titled \"Uses of Lapa\". Lapa is a Qom word meaning, 'much, many'.\u003cbr\u003eHK-T-05_12.pdf - List of Spanish words, their Qom equivalents, and an additional column of notes titled \"Plus lapa\". The document is titled \"Use of pi\". Pi is a Qom particle meaning 'many'.\u003cbr\u003eHK-T-05_06.pdf - Lists of Spanish words and their corresponding Qom roots, with later columns indicating suffixes that may appear with the roots.\u003cbr\u003eHK-T-05_04.pdf - Looseleaf sheet listing Spanish phrases and their Qom equivalents. The purpose of this list is unclear.\u003cbr\u003eHK-T-05_01.pdf - Looseleaf sheets featuring Qom words. The arrangements of Qom words suggests this may have been created to investigate grammatical gender morphology in Qom.\u003cbr\u003eHK-T-16.pdf - Half sheets of paper with interlinearized Qom sentences.\u003cbr\u003eHK-T-11_1.pdf - Notes based on conversations between Harriet Klein and Abel Castro.\u003cbr\u003eHK-T-07_3.pdf - Notes on Qom grammar.\u003cbr\u003eHK-T-08.pdf - Notes on Qom phonological and morphological analysis.\u003cbr\u003eHK-T-09.pdf - Notes on Qom phonological and morphological analysis.\u003cbr\u003eHK-T-06_2.pdf - Notes on Qom phonology.\u003cbr\u003eHK-T-06_3.pdf - Notes on Qom phonology.\u003cbr\u003eHK-T-05_07.pdf - Notes on derivational forms, possibly taken from Estudios Emok-Toba by Branislava Sušnik (1962).\u003cbr\u003eHK-T-11_3.pdf - Notes on Qom sentences.\u003cbr\u003eHK-T-07_4.pdf - Notes on modifiers in Qom.\u003cbr\u003eHK-T-11_2.pdf - Notes on Qom morphemes.\u003cbr\u003eHK-T-05_08.pdf - Page of notes, possibly taken from Estudios Emok-Toba by Branislava Sušnik (1962)\u003cbr\u003eHK-T-05_09.pdf - Page of notes, possibly taken from Estudios Emok-Toba by Branislava Sušnik (1962)\u003cbr\u003eHK-T-05_10.pdf - Page of notes, possibly taken from Estudios Emok-Toba by Branislava Sušnik (1962)\u003cbr\u003eHK-T-14_1.pdf - Pages created as part of an effort to obtain Qom sentences for a LINCOM Languages of the World volume, eventually published in 2001.\u003cbr\u003eHK-T-14_2.pdf - Pages created as part of an effort to obtain Qom sentences for a LINCOM Languages of the World volume, eventually published in 2001.\u003cbr\u003eHK-T-07_2.pdf - Qom words in singular and plural forms (and for adjectives, their distinctive masculine and feminine forms) with English and/or Spanish glosses.\u003cbr\u003eHK-T-13.pdf - Folder of assorted pages of notes and drafts. The materials here mostly date from a 1977 field visit by Harriet Klein, and do not appear elsewhere.\u003cbr\u003eHK-T-15.pdf - Folder labeled \"Chapter V Sentence structure\" containing charts of sentences grouped together by order of constituents.\u003cbr\u003eHK-T-05_05.pdf - Transcribed excerpt of Oswaldo Gómez speaking about sounds. Transcribed from tape 36.\u003cbr\u003eHK-T-06_1.pdf - Various notes on Qom phonology. Many notes say \"slipped\" followed by a date.","es":"HK-T-07_1.pdf - Los demostrativos de qom organizados de acuerdo con varios afijos con los que pueden aparecer.\u003cbr\u003eHK-T-10_5.pdf - Hoja mecanografiada que enumera las palabras españolas con glosas inglesas y sus equivalentes en qom (marcados para poseedor singular en tercera persona). La lista se titula \"N prefijos\".\u003cbr\u003eHK-T-10_1.pdf - Hoja de un borrador de una gramática.\u003cbr\u003eHK-T-05_15.pdf - Las hojas mecanografiadas que enumeran palabras españolas y sus equivalentes en qom (marcados para poseedor singular en tercera persona). La lista se titula \"Género femenino\".\u003cbr\u003eHK-T-10_3.pdf - Las hojas mecanografiadas que enumeran palabras españolas y sus equivalentes en qom (marcados para poseedor singular en tercera persona). La lista se titula \"Género femenino\". Este documento también contiene notas sobre la raíz subyacente de cada palabra qom.\u003cbr\u003eHK-T-05_16.pdf - Las hojas mecanografiadas que enumeran palabras españolas y sus equivalentes en qom (marcados para poseedor singular en tercera persona). La lista se titula \"Género masculino\".\u003cbr\u003eHK-T-10_2.pdf - Las hojas mecanografiadas que enumeran palabras españolas y sus equivalentes en qom (marcados para poseedor singular en tercera persona). La lista se titula \"Género masculino\". Este documento también contiene notas sobre la raíz subyacente de cada palabra qom.\u003cbr\u003eHK-T-10_4.pdf - Hojas de papel que forman una gran hoja de cálculo. En cada fila hay una palabra española y su equivalente en qom. Las columnas posteriores observan la aparición de cada palabra con varios sufijos. La hoja se titula \"Uso de otras formas plurales\". Esta versión del documento también contiene notas adicionales.\u003cbr\u003eHK-T-05_11.pdf - Hojas de papel que forman una gran hoja de cálculo. En cada fila hay una palabra española y su equivalente en qom. Las columnas posteriores observan la aparición de cada palabra con varios sufijos. La hoja se titula \"Uso de otras formas plurales\".\u003cbr\u003eHK-T-05_02.pdf - Hojas sueltas con interlinealizaciones de oraciones en qom. Se puede encontrar más información sobre estas oraciones en sus páginas de cuaderno correspondientes, indicados en la parte superior izquierda de cada hoja.\u003cbr\u003eHK-T-05_13.pdf - Lista de palabras en español, sus equivalentes en qom y su género gramatical en esa lengua. La lista se titula \"Uso de qalotta\". Qalotta es una palabra qom que significa, 'mucho, muchos'.\u003cbr\u003eHK-T-05_14.pdf - Lista de palabras en español, sus equivalentes en qom y su género gramatical en esa lengua. La lista se titula \"Usos de lapa\". Lapa es una palabra qom que significa, 'mucho, muchos'.\u003cbr\u003eHK-T-05_12.pdf - Lista de palabras en español, sus equivalentes en qom y una columna adicional de notas titulada \"Plus lapa\". El documento se titula \"Uso de pi\". Pi es una partícula qom que significa 'muchos'.\u003cbr\u003eHK-T-05_06.pdf - Listas de palabras en español y sus raíces qom correspondientes, con columnas posteriores que indican sufijos que pueden aparecer con las raíces.\u003cbr\u003eHK-T-05_04.pdf - Hoja suelta con una lista de frases españolas y sus equivalentes en qom. El propósito de esta lista no está claro.\u003cbr\u003eHK-T-05_01.pdf - Hojas sueltas con palabras qom. Los arreglos de las palabras qom sugieren que esto puede haberse creado para investigar la morfología de género gramatical en esa lengua.\u003cbr\u003eHK-T-16.pdf - Media hojas de papel con oraciones interlinearizadas de qom.\u003cbr\u003eHK-T-11_1.pdf - Notas basadas en conversaciones entre Harriet Klein y Abel Castro.\u003cbr\u003eHK-T-07_3.pdf - Notas sobre la gramática qom.\u003cbr\u003eHK-T-08.pdf - Notas sobre análisis fonológico y morfológico qom.\u003cbr\u003eHK-T-09.pdf - Notas sobre análisis fonológico y morfológico qom.\u003cbr\u003eHK-T-06_2.pdf - Notas sobre fonología qom.\u003cbr\u003eHK-T-06_3.pdf - Notas sobre fonología qom.\u003cbr\u003eHK-T-05_07.pdf - Notas sobre formas derivacionales, posiblemente tomadas de Estudios Emok-Toba por Branislava Sušnik (1962).\u003cbr\u003eHK-T-11_3.pdf - Notas sobre oraciones qom.\u003cbr\u003eHK-T-07_4.pdf - Notas sobre modificadores en qom.\u003cbr\u003eHK-T-11_2.pdf - Notas sobre los morfemas qom.\u003cbr\u003eHK-T-05_08.pdf - Página de notas, posiblemente tomada de Estudios Emok-Toba por Branislava Sušnik (1962)\u003cbr\u003eHK-T-05_09.pdf - Página de notas, posiblemente tomada de Estudios Emok-Toba por Branislava Sušnik (1962)\u003cbr\u003eHK-T-05_10.pdf - Página de notas, posiblemente tomada de Estudios Emok-Toba por Branislava Sušnik (1962)\u003cbr\  \". O documento é intitulado\" Uso de Pi \". Pi é uma partícula Qom que significa 'muitos '.\u003cbr\u003eHK-T-05_06.pdf - Listas de palavras espanholas e suas raízes QOM correspondentes, com colunas posteriores indicando sufixos que podem aparecer com as raízes.\u003cbr\u003eHK-T-05_04.pdf - LoosEleaf Sheet listando frases espanholas e seus equivalentes QOM. O objetivo desta lista não é claro.\u003cbr\u003eHK-T-05_01.pdf - Looseleaf Sheets com palavras Qom. Os arranjos das palavras QOM sugerem que isso pode ter sido criado para investigar a morfologia gramatical de gênero no Qom.\u003cbr\u003eHK-T-16.pdf - Meias folhas de papel com frases QOM interlinearizadas.\u003cbr\u003eHK-T-11_1.pdf - Notas com base em conversas entre Harriet Klein e Abel Castro.\u003cbr\u003eHK-T-07_3.pdf - Notas sobre a gramática Qom.\u003cbr\u003eHK-T-08.pdf - Notas sobre análise fonológica e morfológica QOM.\u003cbr\u003eHK-T-09.pdf - Notas sobre análise fonológica e morfológica QOM.\u003cbr\u003eHK-T-06_2.pdf - Notas sobre fonologia Qom.\u003cbr\u003eHK-T-06_3.pdf - Notas sobre fonologia Qom.\u003cbr\u003eHK-T-05_07.pdf - Notas sobre formas derivacionais, possivelmente tiradas de Estudios emok-toba por Branislava Sušnik (1962).\u003cbr\u003eHK-T-11_3.pdf - Notas sobre frases QOM.\u003cbr\u003eHK-T-07_4.pdf - Notas sobre modificadores no Qom.\u003cbr\u003eHK-T-11_2.pdf - Notas sobre morfemas Qom.\u003cbr\u003eHK-T-05_08.pdf - Página de notas, possivelmente tirada de Estudios emok-toba por Branislava Sušnik (1962)\u003cbr\u003eHK-T-05_09.pdf - Página de notas, possivelmente tirada de Estudios emok-toba por Branislava Sušnik (1962)\u003cbr\u003eHK-T-05_10.pdf - Página de notas, possivelmente tirada de Estudios emok-toba por Branislava Sušnik (1962)\u003cbr\u003eHK-T-14_1.pdf - Páginas criadas como parte de um esforço para obter sentenças QOM para um volume mundial do Lincom Languages ​​of the World, finalmente publicado em 2001.\u003cbr\u003eHK-T-14_2.pdf - Páginas criadas como parte de um
