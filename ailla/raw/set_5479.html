ge":null,"parent_folder":4999,"description":{"id":24345,"en":"HK-G-18.pdf - Printout of Guaymi-Spanish lexicon \"Pre 2nd Guaymi trip\" ordered by Guaymi forms.\u003cbr\u003eHK-G-19.pdf - Printout of Guaymi-Spanish lexicon \"Pre 2nd Guaymi trip\" ordered by Spanish glosses.\u003cbr\u003eHK-G-09.pdf - Looseleaf sheets with information about locational morphemes and adpositions. A single onionskin sheet giving some hypotheses about Ngäbere phonology. Four handwritten sheets of concordanences of Ngäbere verbs in different tenses with keys to where they appear in the texts.\u003cbr\u003eHK-G-11.pdf - Search results for the string kwe.\u003cbr\u003eHK-G-16.pdf - Search results for the string ti.\u003cbr\u003eHK-G-21.pdf - Search results for the strings ba, uerue, re and kwe. Stapled to notebook sheets.\u003cbr\u003eHK-G-20.pdf - Search results for the strings te, gaw, ni, and ri. Stapled to notebook sheets.\u003cbr\u003eHK-G-12.pdf - Search results for ie (incomplete listing).\u003cbr\u003eHK-G-17.pdf - Search results for various Spanish glosses. Clipped to a list of Spanish words and another notebook sheet.\u003cbr\u003eHK-G-10.pdf - Results of a search for the string gwe.\u003cbr\u003eHK-G-13.pdf - Results of a search for the string ye.\u003cbr\u003eHK-G-15.pdf - Search results for tigwe, magwe, niaragwe, nungwe, mungwe, niaradregwe, tiwe, mawe, mawwe, niarawe, munwe, nunwe, niaradrewe, tibida, mabida, niarabida, nawbida, tinibi, tige, tiye, maye, nunye, mawgro, mawgrawge.\u003cbr\u003eHK-G-14.pdf - All forms up to 449, i.e. 1-448. Search results for strings ne, ye, se, ta, and da.","es":"HK-G-18.pdf - Impresión de un léxico Guaymí-Español \"Antes del segundo viaje guaymi\" ordenado por formas guaymies.\u003cbr\u003eHK-G-19.pdf - Impresión de un léxico Guaymí-Español \"Antes del segundo viaje guaymi\" ordenado por formas españoles.\u003cbr\u003eHK-G-09.pdf - Hojas sueltas con información sobre morfemas y adposiciones locacionales. Una hoja suela con hipótesis sobre la fonología ngäbere. Cuatro hojas de concordancias de verbos ngäberes en diferentes tiempos con claves acerca de dónde encontrarlos en los textos.\u003cbr\u003eHK-G-11.pdf - Resultados de una búsqueda para la secuencia kwe.\u003cbr\u003eHK-G-16.pdf - Resultados de una búsqueda para la secuencia ti.\u003cbr\u003eHK-G-21.pdf - Resultados de búsquedas para las secuencias ba, uerue, re y kwe. Estos fueron grapados a hojas ralladas de cuaderno.\u003cbr\u003eHK-G-20.pdf - Resultados de búsquedas para las secuencias te, gaw, ni, y ri. Estos fueron grapados a hojas ralladas de cuaderno.\u003cbr\u003eHK-G-12.pdf - Resultados de una búsqueda para ie (listado incompleto).\u003cbr\u003eHK-G-17.pdf - Resultados para búsquedas de varias glosas castellanas. Grapado a una lista de palabras castellanas y una hoja de cuaderno.\u003cbr\u003eHK-G-10.pdf - Resultados de una búsqueda para la secuencia gwe.\u003cbr\u003eHK-G-13.pdf - Resultados de una búsqueda para la secuencia ye.\u003cbr\u003eHK-G-15.pdf - Resultados para búsquedas para tigwe, magwe, niaragwe, nungwe, mungwe, niaradregwe, tiwe, mawe, mawwe, niarawe, munwe, nunwe, niaradrewe, tibida, mabida, niarabida, nawbida, tinibi, tige, tiye, maye, nunye, mawgro, mawgrawge.\u003cbr\u003eHK-G-14.pdf - Todas las formas hasta 449, i.e. 1-448. Resultados de búsquedas para las secuencias ne, ye, se, ta, y da.","pt":"HK-G-18.pdf - Impressão do léxico de Guaymi-Spanish\" antes da 2ª viagem de Guaymi \"encomendada pelas formas de Guaymi.\u003cbr\u003eHK-G-19.pdf - Impressão do léxico de Guaymi-Spanish\" antes da 2ª viagem de Guaymi \"encomendada por brilhos espanhóis.\u003cbr\u003eHK-G-09.pdf - Looseleaf Leits com informações sobre morfemas e adposições locacionais. Uma única folha de pele de cebola, dando algumas hipóteses sobre a fonologia de Ngäbere. Quatro folhas manuscritas de concordância dos verbos ngäbere em diferentes tempos com chaves para onde elas aparecem nos textos.\u003cbr\u003eHK-G-11.pdf - Resultados da pesquisa para a string kwe.\u003cbr\u003eHK-G-16.pdf - Resultados da pesquisa para a string ti.\u003cbr\u003eHK-G-21.pdf - Resultados da pesquisa para as cordas BA, UERUE, RE e KWE. Grampeado para folhas de cadernos.\u003cbr\u003eHK-G-20.pdf - Resultados da pesquisa para as cordas TE, GAW, NI e RI. Grampeado para folhas de cadernos.\u003cbr\u003eHK-G-12.pdf - Resultados da pesquisa para o IE (listagem incompleta).\u003cbr\u003eHK-G-17.pdf - Resultados da pesquisa para vários glosses espanhóis. Preso para uma lista de palavras espanholas e outra folha de notebooks.\u003cbr\u003eHK-G-10.pdf - Resultados de uma pesquisa pela string gwe.\u003cbr\u003eHK-G-13.pdf - Resultados de uma pesquisa pela string ye.\u003cbr\u003eHK-G-15.pdf - Search results for tigwe, magwe, niaragwe, nungwe, mungwe, niaradregwe, tiwe, mawe, mawwe, niarawe, munwe, nunwe, niaradrewe, tibida, mabida, niarabida, nawbida, tinibi, tige, tiye, maye, nunye, mawgro, mawgrawge .\u003cbr\u003eHK-G-14.pdf - Todas as formas de até 449, ou seja, 1-448. Resultados da pesquisa para strings NE, YE, SE, TA e DA."},"last_updated":"2024-02-23T10:48:12.876557-06:00","user_last_updated":62,"visibility":"LOG","embargo_date":null,"date_created":19820628,"genre":[10],"genre_detail":[{"id":10,"name":{"id":57,"en":"Dataset","es":"Juego conjunto de datos","pt":"Conjunto de dados"}}],"collection_item_id":{"id":604,"en":"Ngäbere Collection of Harriet Manelis Klein","es":"Colección del Ngäbere de Harriet Manelis Klein","pt":"Coleção Ngäbere de Harriet Manelis Klein"},"folder_item_id":{"id":4999,"en":"Ngäbere Data","es":"Datos de ngäbere","pt":"Dados ngäbere"},"files":[{"id":70592,"legacy_id":"","islandora_pid":"ailla:285623","parent_item":5479,"item_file_id":{"id":5479,"en":"Ngäbere Data","es":"Datos de ngäbere","pt":"Dados ngäbere"},"filename":"HK-G-09.pdf","media_language":[9,47],"media_language_detail":[{"id":9,"name":{"id":376,"en":"Spanish","es":"español","pt":"espanhol"},"language_code":"spa"},{"id":47,"name":{"id":452,"en":"Ngäbere","es":"ng
