arent_folder":2158,"description":{"id":12965,"en":"SPK10_6-30-19_Historia_Bíblica_de_Noé.wav - The biblical story of Noah retold in Uspanteko.\u003cbr\u003eSPK21_11_29_19_historia_personal.wav - Considers multilingualism in Uspantán and the names places and languages.\u003cbr\u003eSPK22_12-31-19_2_Loq'laj_wiitz_Xoqoneb'.wav - Tells of the story of the mountain Xoqoneb', personified as a women curer with her husban, Kan, the serpent.\u003cbr\u003eSPK23_12-31-19-1_Relato_Personal.wav - Tells the story of growing up with a single, widowed mother in Uspantán.\u003cbr\u003eSPK13_7-1-19_Xoqoneb__pach_jtikik_loq_laj_íxim__sagrado_maíz_.wav - Tells the story of poor man who cannot afford a costume to attend the Baile de la Conquista. His is gifted a costume by the supernatural lord of Xoqoneb', a local mountain.\u003cbr\u003eSPK1_6-28-19_Xoqoneb7.wav - Tells the story of poor man who cannot afford a costume to attend the Baile de la Conquista. His is gifted a costume by the supernatural lord of Xoqoneb', a local mountain.\u003cbr\u003eSPK23_12-31-19-2_Relato_personal_2.wav - Tell the story of living alone with sisters, making tortillas for a living.\u003cbr\u003eSPK26_25-02-20_-_Migracion_pedida_de_una_mujer_y_Xoqoneb7.wav - Describes the difficulties women face in migrating to the United States. The second half considers briefly the mountain Xoqoneb' and it's extensive cave systems.\u003cbr\u003eSPK25_25-02-20_-_Semana_Santa_pedida_de_una_mujer_dia_de_difuntos_y_la_navidad.wav - Describes in detail the foods consumed or used for various important or ritual occasions like Holy Week, proposing marriage, Christmas, etc.\u003cbr\u003eSPK22_12-31-19_1_Origen_del_nombre_de_San_Miguel_Uspantan.wav - Discusses the source of the name of San Miguel Uspantán, which derives from an apparation of the archangel Michael on B'a K'ameb', a local mountain.\u003cbr\u003eSPK17_7-6-19_2_Ba_Xiil_jinon_Qayólj_pach_Qabantájk__Historia_de_Baxil_Nuestro_idioma_y_cultura_Uspanteka.wav - Discusses the source of the name of the Baxil neighborhood, which finds its source in rocks in the area that could be used as chairs. It discusses the struggle to get this name officially recognized.\u003cbr\u003eSPK12_7-1-19_Historia_Aldea_Quizahal_(K'ii_Sachál)_y_Pérdida_de_Valores.wav - Discusses the importance of respecting the environment and working together. The second half discusses the history of Quizahal, in particular the mix of K'iche' and Uspanteko families there.\u003cbr\u003eSPK11_7-1-19_2_Historia_Personal_Enseñanza_del_idioma_Uspanteko_(K'utúnk_re_Tz'unun_Yolooj).wav - Discusses the virtue of speaking Uspanteko and speaking it to children.\u003cbr\u003eSPK8_6_30_19_Bailes_de_Uspantán.wav - Discusses some of the dancing traditions associated with Feria that have been lost.\u003cbr\u003eSPK17_7-6-19_1_Yolooj_chub'_Kyeq_K'oxol.wav - Discusses the supernatural beings known as kyeq k'oxol, or `red elves'. Tells the story of a gathering of red elves near the electric plant, and whether they bring good or bad luck.\u003cbr\u003eSPK_TAML_2020_Loq'laj_teew_pach_loq'laj_q'iij_-_El_viento_del_norte_y_el_sol.wav - Elicited retelling (from a written source in Spanish) of \"The north wind and the sun\" as a standard text for phonetic annotation. Transcribed in SPK_TAML_2020_Loq'laj teew pach loq'laj q'iij - El viento del norte y el sol.eaf.\u003cbr\u003eSPK11_7-1-19_1_Historia_Caserío_Baxil_(B'aa_Xiil)_y_Semana_Santa_(Kuréxm).wav - Explains the founding of Baxil, which concerns the discovery of a large stone. The author then discusses how Holy Week was celebrated in Uspantán historically.\u003cbr\u003eSPK6_6_30_19_Historia_Nawal_Montaña.wav - Explains the Nahual of the mountain, its lord.\u003cbr\u003eSPK5_6-30-19_Feria_Uspantán-Elección_Rab'iin_Tinmit.wav - Explains the process of electing the Rab'iin Tinmit, the Maya \"queen\" of the town.\u003cbr\u003eSPK5_6-30-19_Historia_personal_1.wav - Recounts how she become the Rab'iin Tinmit, the Maya \"queen\" of the town.\u003cbr\u003eSPK7_6_30_19_Educación_en_la_comunidad.wav - Recounts her own personal experiences as Maya woman teaching in a school in a non-Maya community.\u003cbr\u003eSPK14_7-2-19-Historia_personal.wav - Recounts a personal encounter with Saqk'oxool, or White Elves, when tending his horses.\u003cbr\u003eSPK9_6-30-19_Historias_de_Uspantán.wav - Recounts a variety of historical happenings in Uspantán, most notably a retelling of the conquest of Uspantán by the Spanish.\u003cbr\u003eSPK6_6_30_19_Relato_Personal.wav - Recounts the work and life of the speaker's grandparents in Uspantán.\u003cbr\u003eSPK15_7-2-19_Relato_Historia_Personal.wav - Relates experiences growing up in Uspantán, in particular planting cane and caring for animals in the mountains.\u003cbr\u003eSPK20_11_29_19_Historia_personal.wav - Relates growing up in Cholá and having to go to draw water near a military encampment, a dangerous prospect.\u003cbr\u003eSPK19_7-6-19_acontecimientos_sobrenaturales.wav - Relates an encounter in the mountain with the Ciguanaba (Siguanaba), a large supernatural creature.\u003cbr\u003eSPK3_6-29-19_Historia_personal.wav - Reminisces on how Holy Week celebrated in childhood.\u003cbr\u003eSPK4_6-29-19_Historia_personal.wav - Reminisces on growing up, especially working with his father in the fields.\u003cbr\u003eSPK2_6-29-19_Historia_personal.wav - Reminisces on growing up, especially on the use of temazcal for bathing.","es":"SPK10_6-30-19_Historia_Bíblica_de_Noé.wav - La historia bíblica de Noé recontada en Uspanteko.\u003cbr\u003eSPK21_11_29_19_historia_personal.wav - Considera el multilingüismo en Uspantán y los nombres de lugares e idiomas.\u003cbr\u003eSPK22_12-31-19_2_Loq'laj_wiitz_Xoqoneb'.wav - Cuenta la historia de la montaña Xoqoneb', personificada como una curandera con su marido, Kan, la serpiente.\u003cbr\u003eSPK23_12-31-19-1_Relato_Personal.wav - Cuenta la historia de crecer con una madre soltera y viuda en Uspantán.\u003cbr\u003eSPK13_7-1-19_Xoqoneb__pach_jtikik_loq_laj_íxim__sagrado_maíz_.wav - Cuenta la historia de un pobre que no puede permitirse un disfraz para asistir al Baile de la Conquista. El suyo recibió un disfraz del señor sobrenatural de Xoqoneb ', una montaña local.\u003cbr\u003eSPK1_6-28-19_Xoqoneb7.wav - Discute la virtud de hablar Uspanteko y hablárselo a los niños.\u003cbr\u003eSPK23_12-31-19-2_Relato_personal_2.wav - Cuente la historia de vivir solo con hermanas, haciendo tortillas para ganarse la vida.\u003cbr\u003eSPK26_25-02-20_-_Migracion_pedida_de_una_mujer_y_Xoqoneb7.wav - Describe las dificultades que enfrentan las mujeres al migrar a los Estados Unidos. La segunda mitad considera brevemente la montaña Xoqoneb' y sus extensos sistemas de cuevas.\u003cbr\u003eSPK25_25-02-20_-_Semana_Santa_pedida_de_una_mujer_dia_de_difuntos_y_la_navidad.wav - Describe en detalle los alimentos consumidos o utilizados para diversas ocasiones importantes o rituales como Semana Santa, proponer matrimonio, Navidad, etc.\u003cbr\u003eSPK22_12-31-19_1_Origen_del_nombre_de_San_Miguel_Uspantan.wav - Analiza la fuente del nombre de San Miguel Uspantán, que deriva de una aparición del arcángel Miguel en B'a K'ameb ', una montaña local.\u003cbr\u003eSPK17_7-6-19_2_Ba_Xiil_jinon_Qayólj_pach_Qabantájk__Historia_de_Baxil_Nuestro_idioma_y_cultura_Uspanteka.wav - Analiza el origen del nombre del barrio Baxil, que encuentra su origen en rocas de la zona que podrían utilizarse como sillas. Discute la lucha por oficializar este nombre.\u003cbr\u003eSPK12_7-1-19_Historia_Aldea_Quizahal_(K'ii_Sachál)_y_Pérdida_de_Valores.wav - Analiza la importancia de respetar el medio ambiente y trabajar juntos. La segunda mitad analiza la historia de Quizahal, en particular la mezcla de familias K'iche 'y Uspanteko allí.\u003cbr\u003eSPK11_7-1-19_2_Historia_Personal_Enseñanza_del_idioma_Uspanteko_(K'utúnk_re_Tz'unun_Yolooj).wav - Discute la virtud de hablar Uspanteko y hablárselo a los niños.\u003cbr\u003eSPK8_6_30_19_Bailes_de_Uspantán.wav - Analiza algunas de las tradiciones de baile asociadas con la Feria que se han perdido.\u003cbr\u003eSPK17_7-6-19_1_Yolooj_chub'_Kyeq_K'oxol.wav - Habla de los seres sobrenaturales conocidos como kyeq k'oxol, o \"duendes rojos\". Cuenta la historia de una reunión de elfos rojos cerca de la planta eléctrica y si traen buena o mala suerte.\u003cbr\u003eSPK_TAML_2020_Loq'laj_teew_pach_loq'laj_q'iij_-_El_viento_del_norte_y_el_sol.wav - Recuento elicitado (de una fuente escrita en español) de \"El viento del norte y el sol\" como texto estándar para la anotación fonética. Transcrito en SPK_TAML_2020_Loq'laj teew pach loq'laj q'iij - El viento del norte y el sol.eaf.\u003cbr\u003eSPK11_7-1-19_1_Historia_Caserío_Baxil_(B'aa_Xiil)_y_Semana_Santa_(Kuréxm).wav - Explica la fundación de Baxil, que se refiere al descubrimiento de una gran piedra. A continuación, el autor comenta cómo se celebraba históricamente la Semana Santa en Uspantán.\u003cbr\u003eSPK6_6_30_19_Historia_Nawal_Montaña.wav - Explica el Nahual de la montaña, su señor.\u003cbr\u003eSPK5_6-30-19_Feria_Uspantán-Elección_Rab'iin_Tinmit.wav - Explica el proceso de elegir a Rab'iin Tinmit, la \"princesa\" Maya del pueblo.\u003cbr\u003eSPK5_6-30-19_Historia_personal_1.wav - Cuenta cómo se convirtió en la Rab'iin Tinmit, la \"reina\" maya del pueblo.\u003cbr\u003eSPK7_6_30_19_Educación_en_la_comunidad.wav - Relata sus propias experiencias personales como mujer maya enseñando en una escuela en una comunidad no maya.\u003cbr\u003eSPK14_7-2-19-Historia_personal.wav - Relata un encuentro personal con Saqk'oxool, o duendes blancos, cuando cuidaba sus caballos.\u003cbr\u003eSPK9_6-30-19_Historias_de_Uspantán.wav - Relata una variedad de acontecimientos históricos en Uspantán, el más notable es un recuento de la conquista de Uspantán por parte de los españoles.\u003cbr\u003eSPK6_6_30_19_Relato_Personal.wav - Relata la obra y vida de los abuelos del hablante en Uspantán.\u003cbr\u003eSPK15_7-2-19_Relato_Historia_Personal.wav - Relata experiencias de crianza en Uspantán, en particular sembrando caña y cuidando animales en la montaña.\u003cbr\u003eSPK20_11_29_19_Historia_personal.wav - Relata haber crecido en Cholá y tener que ir a sacar agua cerca de un campamento militar, una perspectiva peligrosa.\u003cbr\u003eSPK19_7-6-19_acontecimientos_sobrenaturales.wav - Relata un encuentro en la montaña con la Ciguanaba (Siguanaba), una gran criatura sobrenatural.\u003cbr\u003eSPK3_6-29-19_Historia_personal.wav - Recuerda cómo se celebraba la Semana Santa en su infancia.\u003cbr\u003eSPK4_6-29-19_Historia_personal.wav - Recuerda haber crecido, especialmente trabajando con su padre en el campo.\u003cbr\u003eSPK2_6-29-19_Historia_personal.wav - Recuerda el crecimiento, especialmente el uso del temazcal para bañarse.","pt":"SPK10_6-30-19_Historia_Bíblica_de_Noé.wav - A história bíblica de Noah recontou em USPANTEKO.\u003cbr\u003eSPK21_11_29_19_historia_personal.wav - Considera o multilinguismo no USPANTÁN e os nomes de lugares e idiomas.\u003cbr\u003eSPK22_12-31-19_2_Loq'laj_wiitz_Xoqoneb'.wav - Conta a história da montanha Xoqoneb ', personificada como uma mulher curadora com seu Husban, Kan, a serpente.\u003cbr\u003eSPK23_12-31-19-1_Relato_Personal.wav - Conta a história de crescer com uma mãe solteira e viúva em Uspantán.\u003cbr\u003eSPK13_7-1-19_Xoqoneb__pach_jtikik_loq_laj_íxim__sagrado_maíz_.wav - Conta a história do pobre homem que não pode pagar uma fantasia para participar da Baile de la conquista. Ele é dotado de uma fantasia pelo senhor sobrenatural de Xoqoneb ', uma montanha local.\u003cbr\u003eSPK1_6-28-19_Xoqoneb7.wav - Conta a história do pobre homem que não pode pagar uma fantasia para participar da Baile de la conquista. Ele é dotado de uma fantasia pelo senhor sobrenatural de Xoqoneb ', uma montanha local.\u003cbr\u003eSPK23_12-31-19-2_Relato_personal_2.wav - Conte a história de morar sozinha com irmãs, fazendo tortilhas para viver.\u003cbr\u003eSPK26_25-02-20_-_Migracion_pedida_de_una_mujer_y_Xoqoneb7.wav - Descreve as dificuldades que as mulheres enfrentam na migração para os Estados Unidos. A segunda metade considera brevemente o Mountain Xoqoneb 'e seus extensos sistemas de cavernas.\u003cbr\u003eSPK25_25-02-20_-_Semana_Santa_pedida_de_una_mujer_dia_de_difuntos_y_la_navidad.wav - Descreve em detalhes os alimentos consumidos ou usados ​​para várias ocasiões importantes ou rituais, como a Semana Santa, propondo casamento, Natal etc.\u003cbr\u003eSPK22_12-31-19_1_Origen_del_nombre_de_San_Miguel_Uspantan.wav - Discute a fonte do nome de San Miguel Uspantán, que deriva de uma aparição do Arcanjo Miguel em B'a K'ameb ', uma montanha local.\u003cbr\u003eSPK17_7-6-19_2_Ba_Xiil_jinon_Qayólj_pach_Qabantájk__Historia_de_Baxil_Nuestro_idioma_y_cultura_Uspanteka.wav - Discute a fonte do nome do bairro de Baxil, que encontra sua fonte em rochas na área que pode ser usada como cadeiras. Ele discute a luta para obter esse nome oficialmente reconhecido.\u003cbr\u003eSPK12_7-1-19_Historia_Aldea_Quizahal_(K'ii_Sachál)_y_Pérdida_de_Valores.wav - Discute a importância de respeitar o meio ambiente e trabalhar juntos. A segunda metade discute a história de Quizahal, em particular a mistura das famílias K'iche 'e USPanteko lá.\u003cbr\u003eSPK11_7-1-19_2_Historia_Personal_Enseñanza_del_idioma_Uspanteko_(K'utúnk_re_Tz'unun_Yolooj).wav - Discute a virtude de falar USPanteko e falar com crianças.\u003cbr\u003eSPK8_6_30_19_Bailes_de_Uspantán.wav - Discute algumas das tradições dançantes associadas à Feria que foram perdidas.\u003cbr\u003eSPK17_7-6-19_1_Yolooj_chub'_Kyeq_K'oxol.wav - Discute os seres sobrenaturais conhecidos como Kyeq K'oxol, ou `Elfos Vermelhos '. Conta a história de uma reunião de elfos vermelhos perto da planta elétrica e se eles trazem boa ou má sorte.\u003cbr\u003eSPK_TAML_2020_Loq'laj_teew_pach_loq'laj_q'iij_-_El_viento_del_norte_y_el_sol.wav - Excunhou recontagem (de uma fonte escrita em espanhol) de\" T
