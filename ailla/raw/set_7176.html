s_description_language":null,"parent_folder":6676,"description":{"id":30948,"en":"013_Challi_Chuchi_en_kichwa.wav - Children’s story: Challi purik chuchi, told by Magdalena Pichisaca Mayencela.Cañar, Cañar.\u003cbr\u003e015_Chuzalongo_español.wav - Children’s story: Chuza Longo told by Magdalena Guamán Falcón. Cañar, Cañar.\u003cbr\u003e014_Chuzalongo__kichwa.wav - Children’s story: Chuza lunku, told by Magdalena Guamán Falcón. Cañar, Cañar.\u003cbr\u003e012_Challi_Chuchi_en_español.wav - Children’s story: The Walking Chick, or El pollito andariego, told by Magadalena Pichisaca Mayancela. Cañar, Cañar.\u003cbr\u003e007_Juanito_Tenasaca_-_Archeological_finds.wav - Juanito Tenesaca Aguaza tells tales about he and others finding and selling ceramic pieces and relics from archaeological sites in Cañar, within a context of the hacienda, museums and local traders creating fakes. Interviewers: Judy Blankenship and Alexandra Kennedy. La Capilla, Chorocopte.\u003cbr\u003e002_Mama_Juana_Pichisaca_-_Carnival_Songs.wav - Mama Juana Pichisaca (speaking in Kichwa, talks about the songs of Carnival, then sings four songs: Chito, Novia Castigo, Llorando y Marido Perdido. Quilloac, Cañar.\u003cbr\u003e008_Maria_Clara_Mainato_Acero_-_Songs.wav - Mama María Clara, with a beautiful high voice, sings songs, with José Miguel Acero explaining: Travel to Quito on Horseback to bring Salt; Mala Cristiana; Little Deer (?); Jubaleña; Padrino/Madrina. (At 24:21 her daughter Clarita begins to sing the last few songs.). Interviewers: Judy Blankenship and Jose Miguel Acero. Correucu, Cañar.\u003cbr\u003e001_Mama_Michi_Curandera-_Life_History.wav - Mama Michi (Mercedes Chuma Quishpilema) describes how she realized she was a healer during her childhood. Learning medicinal plants from her aunts, and ceremonial rituals from others, she slowly built her practice and fame that took her to Canada, Mexico, the U.S. and beyond. Recorded in Portland, Oregon in 2006.\u003cbr\u003e006_Mama_Paula_Duy_Folktales.wav - Mama Paula Duy Duchi tells several folktales, among them Serpent in the Lake, Lashakos, The Ladies Man, Mama Awardona, Urku Yaya and others. Interviewers: Judy Blankenship and Paiwa Maintano. Correucu, Cañar.\u003cbr\u003e004_Mariana_Chuma2_Midwife_-__El_Cinco_.wav - Mariana Chuma Quishpilema, trained nurse and midwife, describes the rituals and practices of El Cinco, the fifth day after birth when the baby and new mother are bathed with herbs and flowers, and checks the condition of both.\u003cbr\u003e003_Mariana_Chuma1_Midwife_-_Home_Birth_Practices.wav - Mariana Chuma Quishpilema, trained nurse and midwife, explains in detail a home birth, using both Western medicine and traditional practices. She describes the stages while viewing a series of photos taken by Judy Blankenship during an earlier home birth.\u003cbr\u003e005_Mariana_Chuma3_Midwife_-_Life_History.wav - Mariana Chuma Quishpilema, trained nurse and midwife, tells the story of her life, beginning with her childhood. She covers her unusual early education as an indigenous child, then as a trained nurse assigned to a community clinic. She tells how medicina nativa was formerly forbidden and could send a healer to jail.\u003cbr\u003e016_El_Hombre_que_se_convirtió_en_palo.wav - Paiwa, 10 years, tells the folktale of The Man Who Turned into a Tree for Being Lazy.\u003cbr\u003e011_Paiwa_Acero_Mainato_Folktales.wav - Paiwa, 10 years, granddaughter of Mama Paula Duy Duchi, retells the stories her grandmother told in recording 006. (See transcriptions.). Interviewer: Judy Blankenship. Cañar, Cañar.\u003cbr\u003e009_Pedro_Solano_-_History_Festival_Cycle.wav - Pedro Solano Falcón describes the importance of the festival cycle to the Cañari culture: how animals, elements, tools, crops, and especially nature are essential to the native people and their fiestas. The agriculture cycle provides the four principal fiestas of the year: Kapak Raymi, Pawkar Raymi, Inti Raymi and Killa Raymi. Interviewer: Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e010_Pedro_Solano_-_History_Fiesta_de_San_Antonio.wav - Pedro Solano Falcón describes the Fiesta de San Antonio de Padua, celebrated in the community of Junducuchu. Preparations last all year and the fiesta itself lasts eight days, including escaramuzas with horseback riders; contradanzas with young girls and boys, fireworks, hired bands, and a bullfight on the final day. Interviewer: Judy Blankenship. Quilloac, Cañar.","es":"013_Challi_Chuchi_en_kichwa.wav - Canción infantil: Challi purik chuchi contado por Magdalena Pichisaca Mayancela. Cañar, Cañar.\u003cbr\u003e015_Chuzalongo_español.wav - Canción infantil: Chuza Longo contado por Magdalena Guamán Falcón. Cañar, Cañar.\u003cbr\u003e014_Chuzalongo__kichwa.wav - Canción infantil: Chuza lunku contado por Magdalena Guamán Falcón. Cañar, Cañar.\u003cbr\u003e012_Challi_Chuchi_en_español.wav - Canción infantil: El pollito andariego contado por Magdalena Pichisaca Mayancela. Cañar, Cañar.\u003cbr\u003e007_Juanito_Tenasaca_-_Archeological_finds.wav - Juanito Tenesaca Aguaza cuenta historias sobre él y otros encontrando y vendiendo piezas de cerámica y reliquias de sitios arqueológicos en Cañar, en un contexto de hacienda, museos y comerciantes locales que hacen falsificaciones. Entrevistadoras: Judy Blankenship y Alexandra Kennedy. La Capilla, Chotocopte.\u003cbr\u003e002_Mama_Juana_Pichisaca_-_Carnival_Songs.wav - Mama Juana Pichisaca, hablando en kichwa, habla de las canciones del Carnaval, luego canta cuatro canciones: Chito, Novia Castigo, Llorando y Marido Perdido. Quilloac, Cañar.\u003cbr\u003e008_Maria_Clara_Mainato_Acero_-_Songs.wav - Mamá María Clara, con una hermosa voz aguda, canta canciones, con José Miguel Acero explicándolas: Viaje a Quito a caballo para traer Salt; Mala Cristiana; Pequeño ciervo (?); Jubaleña; Padrino / Madrina. (A las 24:21 su hija Clarita comienza a cantar las últimas canciones). Entrevistadores: Judy Blankenship y José Miguel Acero. Correucu, Cañar.\u003cbr\u003e001_Mama_Michi_Curandera-_Life_History.wav - Mama Michi (Mercedes Chuma Quishpilema) se dio cuenta de que era una curandera nativa desde su infancia. Aprendiendo plantas medicinales de sus tías y rituales ceremoniales de otras personas, poco a poco construyó su práctica y fama que la llevaron a Canadá, México, Estados Unidos y más allá. Entrevistadora: Judy Blankenship. Portland, Oregon\u003cbr\u003e006_Mama_Paula_Duy_Folktales.wav - Mama Paula Duy Duchi nos cuenta varios cuentos populares, entre ellos Serpiente en el lago, Lashakos, el Mujeriego, Mama Awardona, Urku Yaya y otros. Entrevistadoras: Judy Blankenship y Paiwa Maintano. Correucu, Cañar.\u003cbr\u003e004_Mariana_Chuma2_Midwife_-__El_Cinco_.wav - Mariana Chuma Quishpilema, enfermera y partera, describe los rituales y prácticas de El Cinco, el quinto día después del nacimiento cuando el bebé y la nueva madre son bañados con hierbas y flores, y se revisa el estado de ambos.\u003cbr\u003e003_Mariana_Chuma1_Midwife_-_Home_Birth_Practices.wav - Mariana Chuma Quispilema, enfermera y partera, explica en detalle un parto en casa, utilizando tanto la medicina occidental como las prácticas tradicionales. Ella describe las etapas mientras ve una serie de fotos tomadas por Judy Blankenship durante un parto en casa anterior.\u003cbr\u003e005_Mariana_Chuma3_Midwife_-_Life_History.wav - Mariana Chuma Quishpilema, enfermera y partera, cuenta la historia de su vida, comenzando con su infancia. Ella cubre su inusual educación temprana como niña indígena, luego como enfermera capacitada asignada a una clínica comunitaria. Cuenta cómo la medicina nativa estaba prohibida y podía enviar a un practicante a la cárcel.\u003cbr\u003e016_El_Hombre_que_se_convirtió_en_palo.wav - Paiwa, de 10 años, cuenta el cuento popular de El hombre que se convirtió en árbol por ser vago.\u003cbr\u003e011_Paiwa_Acero_Mainato_Folktales.wav - Paiwa, de 10 años, nieta de Mama Paula Duy Duchi, vuelve a contar las historias que contó su abuela en la grabación 006 (ver transcripciones). Entrevistadora: Judy Blankenship. Cañar, Cañar.\u003cbr\u003e009_Pedro_Solano_-_History_Festival_Cycle.wav - Pedro Solano Falcón describe la Fiesta de San Antonio de Padua celebrada en la comunidad de Junducuchu, Quilloac, Cañar. Las preparaciones duran todo el año y la fiesta en sí dura ocho días, incluyendo escaramuzas con jinetes; contradanzas, fuegos artificiales, bandas contratadas y corrida de toros el último día. Entrevistadora: Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e010_Pedro_Solano_-_History_Fiesta_de_San_Antonio.wav - Pedro Solano Falcón desribe la Fiesta de San Antonio de Padua celebrada en la comunidad de Junducuchu, Las preparaciones duran todo el año y la fiesta en sí dura ocho días, incluyendo escaramuzas con jinetes; contradanzas, fuegos artificiales, bandas contratadas y corrida de toros el último día. Entrevistadora: Judy Blankenship. Quilloac, Cañar.","pt":"013_Challi_Chuchi_en_kichwa.wav - História das crianças: Challi Purik Chuchi, contada por Magdalena Pichisaca Mayenencela.cañar, Cañar.\u003cbr\u003e015_Chuzalongo_español.wav - História das crianças: Chuza Longo, contada por Magdalena Guamán Falcón. Cañar, Cañar.\u003cbr\u003e014_Chuzalongo__kichwa.wav - História das crianças: Chuza Lunku, contada por Magdalena Guamán Falcón. Cañar, Cañar.\u003cbr\u003e012_Challi_Chuchi_en_español.wav - História das crianças: The Walking Chick, ou El Pollito Andariego, contado por Magadalena Pichisaca Mayancela. Cañar, Cañar.\u003cbr\u003e007_Juanito_Tenasaca_-_Archeological_finds.wav - Juanito Tenesaca Aguaza conta histórias sobre ele e outros encontrando e vendendo peças de cerâmica e relíquias de sítios arqueológicos em Cañar, dentro de um contexto da Hacienda, museus e comerciantes locais, criando falsificações. Entrevistadores: Judy Blankenship e Alexandra Kennedy. La Capilla, Chorocopte.\u003cbr\u003e002_Mama_Juana_Pichisaca_-_Carnival_Songs.wav - Mama Juana Pichisaca (falando em Kichwa, fala sobre as canções do carnaval, então canta quatro músicas: Chito, Novia Castigo, Llorando y Marido Perdido. Quilloac, Cañar.\u003cbr\u003e008_Maria_Clara_Mainato_Acero_-_Songs.wav - Mama María Clara, com uma bela voz alta, canta músicas, com José Miguel Acero explicando: viajar para Quito a cavalo para trazer sal; Mala Cristiana; Pequeno cervo (?); Jubaleña; Padrino/Madrina. (Às 24:21, sua filha Clarita começa a cantar as últimas músicas.). Entrevistadores: Judy Blankenship e Jose Miguel Acero. Correucu, Cañar.\u003cbr\u003e001_Mama_Michi_Curandera-_Life_History.wav - Mama Michi (Mercedes Chuma Quishpilema) descreve como ela percebeu que era uma curandeira durante sua infância. Aprendendo plantas medicinais de suas tias e rituais cerimoniais de outras pessoas, ela lentamente construiu sua prática e fama que a levaram ao Canadá, México, EUA e além. Gravado em Portland, Oregon em 2006.\u003cbr\u003e006_Mama_Paula_Duy_Folktales.wav - Mama Paula Duy Duchi diz a vários contos folclóricos, entre eles serpentes no lago, Lashakos, The Ladies Man, Mama Awardona, Urku Yaya e outros. Entrevistadores: Judy Blankenship e Paiwa Maineno. Correucu, Cañar.\u003cbr\u003e004_Mariana_Chuma2_Midwife_-__El_Cinco_.wav - Mariana Chuma Quishpilema, enfermeira e parteira treinada, descreve os rituais e práticas de El Cinco, o quinto dia após o nascimento, quando o bebê e a nova mãe são banhados com ervas e flores e verifica a condição de ambos.\u003cbr\u003e003_Mariana_Chuma1_Midwife_-_Home_Birth_Practices.wav - Mariana Chuma Quishpilema, enfermeira e parteira treinada, explica em detalhes um parto em casa, usando a medicina ocidental e as práticas tradicionais. Ela descreve as etapas enquanto visualizava uma série de fotos tiradas por Judy Blankenship durante um parto em casa anterior.\u003cbr\u003e005_Mariana_Chuma3_Midwife_-_Life_History.wav - Mariana Chuma Quishpilema, enfermeira treinada e parteira, conta a história de sua vida, começando com sua infância. Ela cobre sua educação inicial incomum quando criança indígena, então como uma enfermeira treinada designada para uma clínica comunitária. Ela conta como Medicina Nativa era anteriormente proibida e poderia enviar um curandeiro para a prisão.\u003cbr\u003e016_El_Hombre_que_se_convirtió_en_palo.wav - Paiwa, 10 anos, conta ao conto folclórico do homem que se transformou em uma árvore por ser preguiçoso.\u003cbr\u003e011_Paiwa_Acero_Mainato_Folktales.wav - Paiwa, 10 anos, neta de Mama Paula Duy Duchi, reconta as histórias que sua avó contou na gravação 006. (ver transcrições.). Entrevistador: Judy Blankenship. Cañar, Cañar.\u003cbr\u003e009_Pedro_Solano_-_History_Festival_Cycle.wav - Pedro Solano Falcón descreve a importância do ciclo do festival para a cultura Cañari: como animais, elementos, ferramentas, culturas e especialmente a natureza são essenciais para o povo nativo e seus festas. O ciclo agrícola fornece as quatro principais festas do ano: Kapak Raymi, Pawkar Raymi, Inti Raymi e Killa Raymi. Entrevistador: Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e010_Pedro_Solano_-_History_Fiesta_de_San_Antonio.wav - Pedro Solano Falcón descreve o Fiesta de San Antonio de Pádua, comemorado na comunidade de Junducuchu. Os preparativos duram o ano todo e o próprio Fiesta dura oito dias, incluindo escaramuzas com cavaleiros; contradanzas com meninas e meninos, fogos de artifício, bandas contratadas e uma tourada no último dia. Entrevistador: Judy Blankenship. Quilloac, Cañar."},"last_updated":"2024-04-19T12:52:44.215677-05:00","user_last_updated":62,"visibility":"LOG","embargo_date":null,"date_created":10000101,"genre":[18,28,46],"genre_detail":[{"id":18,"name":{"id":73,"en":"Ethnography","es":"Etnografía","pt":"Etnografia"}},{"id":28,"name":{"id":93,"en":"Interview","es":"Entrevista","pt":"Entrevista"}},{"id":46,"name":{"id":129,"en":"Song","es":"Canción","pt":"Canção"}}],"collection_item_id":{"id":722,"en":"Cañar Collection of Judy Blankenship","es":"Colección de Cañar de Judy Blankenship","pt":"Co
