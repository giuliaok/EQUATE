cription":"","indigenous_description_language":null,"parent_folder":411,"description":{"id":5288,"en":"txu-ailla-bstross-a.wav - The content notes below were made by AILLA staff in 2020. txu-ailla-bstross-a.wav: 00:00 Brian Stross addresses Brent Berlin in English. 00:15 A woman hums a melody and sings in Tseltal while roosters crow in the background. 04:40 Stross introduces Tatik Bot's brother-in-law Antonio, who sings in Tseltal. 06:02 Antonio speaks with another man in Tseltal. 06:15 Antonio continues singing. 07:38 Antonio speaks with another man in Tseltal. 08:04 Antonio continues singing. 09:49 Antonio speaks with another man in Tseltal. 10:08 Antonio continues singing. 12:33 end\u003cbr\u003etxu-ailla-bstross-b.wav - The content notes below were made by AILLA staff in 2020. txu-ailla-bstross-b.wav: 00:00 Brian Stross addresses Brent Berlin in English, giving updates on his fieldwork and tells about the beginning of his work collecting plant names along a trail. Tells of Alonzo's bout of malaria. Collecting secondary color terms. Majosik' census report. Eating tropical fruits. Farewells in Tseltal. 05:12 Stross says \"Can you guess what this is? What language?\" Then a child begins to sing. 10:27 Some animal calls and some whistles for people given by Don Manik. 11:35 Whistling for a girlfriend to come out 11:48 When a man visits another man and doesn't want to enter the house 12:16 The visitor can whistle in this fashion 12:30 The owner of the house can whistle to ask \"what?\" or to let the visitor know that they're home 12:52 Calling chickens 13:02 Calling chicks 13:11 Calling adult turkeys 13:18 Calling baby turkeys 13:27 Calling a dog 13:40 Calling a dog in order to get it to come back to the trail 13:53 Calling pigs to eat 14:01 Calling a bull 14:11 Calling a mule 14:22 Calling a cat 14:30 Laughter. People speak in Tseltal. 15:21 A woman sings in Tseltal.\u003cbr\u003etxu-ailla-bstross-box-recto.jpg - No description.\u003cbr\u003etxu-ailla-bstross-box-verso.jpg - No description.","es":"txu-ailla-bstross-a.wav - Los apuntes sobre el contenido fue creado por personal de AILLA en 2020. txu-ailla-bstross-a.wav: 00:00 Brian Stross se dirige a Brent Berlin en inglés. 00:15 Una mujer canturrea una melodia y canta en tseltal mientras un gallo canta al fondo. 04:40 Stross presenta a Antonio el cuñado de Tatik Bot quien canta en tseltal. 06:02 Antonio habla con otro en tseltal. 06:15 Antonio sigue cantando. 07:38 Antonio habla con otro en tseltal. 08:04 Antonio sigue cantando. 09:49 Antonio habla con otro en tseltal. 10:08 Antonio sigue cantando. 12:33 fin\u003cbr\u003etxu-ailla-bstross-b.wav - Los apuntes sobre el contenido fue creado por personal de AILLA en 2020. txu-ailla-bstross-b.wav: 00:00 Brian Stross se dirige a Brent Berlin en inglés, dándole actualizaciones sobre su trabajo de campo y el comienzo de su recopilación de nombre de plantas a lo largo de un sendero. Habla de la malaria que Alonzo padeció. Recopilar términos secundario de colores. Reporte del censo de Majosik'. Comer frutas tropicales. Despedidas en tseltal. 05:12 Stross dice \"¿Puedes adivinar qué es esto? ¿Cuál idioma?\" Enseguida, un niño o niña empieza a cantar. 10:27 Algunas llamadas de animales y silbatos para gente por Don Manik. 11:35 Silbato para que salga la novia 11:48 Silbato para cuando un hombre visita a otro y no quiere entrar la casa 12:16 El visitante puede silbar así 12:30 El dueño de la casa puede silbar para preguntar \"¿Qué?\" o simplemente para avisar que está en casa 12:52 Llamar gallinas 13:02 Llamar pollitos 13:11 Llamar guajolotes 13:18 Llamar guajolotitos 13:27 Llamar un perro 13:40 Llamar un perro para que regrese al camino 13:53 Llamar los marranos a comer 14:01 Llamar un toro 14:11 Llamar una mula 14:22 Llamar un gato 14:30 Risas. Gente hablan en tseltal. 15:21 Una mujer canta en tseltal.\u003cbr\u003etxu-ailla-bstross-box-recto.jpg - Sin descripción.\u003cbr\u003etxu-ailla-bstross-box-verso.jpg - Sin descripción.","pt":"tx
