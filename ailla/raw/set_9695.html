","indigenous_description_language":null,"parent_folder":9155,"description":{"id":40718,"en":"HK-NB-05.pdf - Bachiller 100 page notebook. Blank slips of paper inserted as bookmarks. Klein's Book 5 spanning fieldwork activities from October 9, 1971 to November 22, 1971 and recordings on Tapes 22 to 31. Qom speakers Oswaldo Gómez, Julio Ramírez, and Nieves Ramírez are mentioned in the notebook.\u003cbr\u003eHK-NB-04.pdf - Bachiller 100 page notebook. Fileslips and note sheets inserted in the notebook. Klein's Book 4 spanning fieldwork activities from September 17, 1971 to October 9, 1971 and recordings on Tapes 14 to 22. Qom speakers Julio Ramírez, Adriano Ángel Canciano, and Oswaldo Gómez are mentioned in the notebook.\u003cbr\u003eHK-NB-09.pdf - Bachiller 100 page notebook. Fileslips inserted. Klein's Book 9 spanning fieldwork activities from December 20, 1971 to January 12, 1972 and recordings on Tapes 34 to 39. Qom speakers Oswaldo Gómez and Julio Ramírez are mentioned in the notebook.\u003cbr\u003eHK-NB-03.pdf - Bachiller 100 page notebook. Bookmark indicates start of prefix info. Some letter size notebook sheets are stapled into the notebook. Klein's Book 3 spanning fieldwork activities from August 30, 1971 to at least September 15, 1971 and recordings on Tapes 8 to 14. Qom speaker Julio Ramírez and some of his family members are mentioned in the notebook.\u003cbr\u003eHK-NB-08.pdf - Bachiller 100 page notebook. Note sheets and file slips inserted. Klein's Book 8 spanning fieldwork activities from November 22, 1971 to December 20, 1971 and recordings on Tapes 28 to 34. Qom speakers Oswaldo Gómez, Julio Ramírez, Marcelo González and Eduardo Ramírez are mentioned in the notebook. Others mentioned are Hilario Thomas, the Cacique General of Toba, and Pedro Martínez, a former Cacique General.\u003cbr\u003eHK-NB-10.pdf - Bachiller 100 page notebook. Klein's Book 10 spanning fieldwork activities from January 12, 1972 to January 25, 1972 and recordings on Tapes 39 to 44. Qom speaker Julio Ramírez and Oswaldo Gómez is mentioned in the notebook.\u003cbr\u003eHK-NB-13.pdf - Bachiller 50 page notebook. Many blank pages. Klein's notebook spanning fieldwork activities from June 21, 1974 to June 28, 1974. Qom speaker Oswaldo Gómez is mentioned in the notebook.\u003cbr\u003eHK-NB-11.pdf - Bachiller 50 page notebook. Many blank pages. Klein's Book 11 spanning fieldwork activities on January 25, 1972 and recordings on Tapes 43 to 44. Some pages appear to reference Reyburn's 1956 work A short descriptive grammar of the Toba (El Espinillo dialect).\u003cbr\u003eHK-NB-06.pdf - Bachiller 50 page notebook. Klein's Book 6 spanning fieldwork activities during an unrecorded period of time and recordings on at least Tape 29A. Qom speaker Ramón Corbalán, Nita Pérez, Abel Jorge Castro, Seferino Castro, and Orlando Sánchez is mentioned in the notebook. Others mentioned include Marcelo González, the Vice-President of the Comission of Pampa del Indio, Julio Olivos, a pastor in Resistencia, and Juan E. Endiricio, a Lengua speaker from Fortín Lavalle.\u003cbr\u003eHK-NB-07.pdf - Bachiller 50 page notebook. Klein's Book 7 spanning fieldwork activities during an unrecorded period of time and recordings on at least Tape 29. Qom speakers Abel Castro, Carlos Moreno, Evaristo Moreno, Juan Eduardo Enderecio, Nita Pérez, Seferino Castro, Marcelo González, Aurelio López, Oswaldo Gómez, and Julio Olivos are mentioned in the notebook.\u003cbr\u003eHK-NB-12.pdf - Sarandi spiralbound notebook. Inserted slips of paper. Klein's Book 12 spanning fieldwork activities from June 12, 1972 to June 24, 1972 and recordings on at least Tape 46. Qom speakers Ramón Corbalán and Oswaldo Gómez are mentioned in the notebook.\u003cbr\u003eHK-NB-15.pdf - América 2000 notebook with image of a rower. Klein's notebook spanning fieldwork activities from July 10, 1987 to July 19, 1987 and recordings on Tapes 1 to 7. Qom speakers Oswaldo Gómez, Nieves Ramírez, Orlando Sánchez and José Patricio are mentioned in the notebook.\u003cbr\u003eHK-NB-02.pdf - Avon notebook with black dots on white background. Some slips of paper apparently inserted as bookmarks. Klein's Book 2 spanning fieldwork activities from August 21, 1971 to at least August 29, 1971 and recordings on Tapes 5 to 8A.\u003cbr\u003eHK-NB-01.pdf - Avon notebook with black dots on white background. Klein's Book 1 spanning fieldwork activities from August 11, 1971 to August 21, 1971 and recordings on Tapes 1 to 4. Qom speaker Oswaldo Gómez is mentioned in the notebook.\u003cbr\u003eHK-NB-K.pdf - Green and red notebook carried during field research on Kadiwéu in Brazil. Some of the initial pages have \"G. Griffiths 12/8/78\" inscribed on them presumably referring to a meeting between Harriet Klein and Glyn Griffiths. The notebook covers fieldwork between December 13, 1978 and August 16 (presumably 1979) and occasionally features notes Aspectos da Língua Kadiwéu (1976) by Glyn Griffiths and Cynthia Griffiths. Kadiwéu speaker Albertina Méndez is mentioned within the notebook.\u003cbr\u003eHK-NB-14.pdf - Notebook \"Avon flex\" with black dots on a white background. Inserted are several clipped together sheets of examples and notes. Klein's Notebook 1 spanning fieldwork activities from July 31, 1977 to August 6, 1977. Qom speaker Ramón Corbalán is mentioned in the notebook. Some pages mention E. Miller's vocabulary.","es":"HK-NB-05.pdf - Cuaderno marca Bachiller de 100 páginas. Fichas en blanco están insertadas como marcadores. El libro 5 de Klein que abarca actividades de trabajo de campo del 9 de octubre de 1971 al 22 de noviembre de 1971 y las grabaciones en las cintas 22 a 31. Los hablantes de qom Oswaldo Gómez, Julio Ramírez y Nieves Ramírez se mencionan en el cuaderno.\u003cbr\u003eHK-NB-04.pdf - Cuaderno marca Bachiller de 100 páginas. Fichas y hojas de notas están insertadas en el cuaderno. El libro 4 de Klein que abarca actividades de trabajo de campo del 17 de septiembre de 1971 al 9 de octubre de 1971 y las grabaciones en las cintas 14 a 22. Los hablantes de qom Julio Ramírez, Adriano Ángel Canciano y Oswaldo Gómez se mencionan en el cuaderno.\u003cbr\u003eHK-NB-09.pdf - Cuaderno marca Bachiller de 100 páginas. Fichas insertadas. El libro 9 de Klein que abarca actividades de trabajo de campo del 20 de diciembre de 1971 al 12 de enero de 1972 y las grabaciones en las cintas 34 a 39. Los hablantes de qom Oswaldo Gómez y Julio Ramírez se mencionan en el cuaderno.\u003cbr\u003eHK-NB-03.pdf - Cuaderno marca Bachiller de 100 páginas. Marcador indica la información del prefijo del inicio. Algunas hojas de cuaderno de tamaño de letra están grapadas en el cuaderno. El libro 3 de Klein que abarca actividades de trabajo de campo desde el 30 de agosto de 1971 hasta al menos el 15 de septiembre de 1971 y las grabaciones en las cintas de 8 a 14. El hablante de qom Julio Ramírez y algunos de los miembros de su familia se mencionan en el cuaderno.\u003cbr\u003eHK-NB-08.pdf - Cuaderno marca Bachiller de 100 páginas. Notas están insertadas como marcadores. El libro 8 de Klein que abarca actividades de trabajo de campo del 22 de noviembre de 1971 al 20 de diciembre de 1971 y las grabaciones en las cintas 28 a 34. Los hablantes de qom Oswaldo Gómez, Julio Ramírez, Marcelo González y Eduardo Ramírez se mencionan en el cuaderno. Otros mencionados son Hilario Thomas, el Cacique General de Toba y Pedro Martínez, un antiguo Cacique General.\u003cbr\u003eHK-NB-10.pdf - Cuaderno marca Bachiller de 100 páginas. El libro 10 de Klein que abarca actividades de trabajo de campo desde el 12 de enero de 1972 hasta el 25 de enero de 1972 y las grabaciones en las cintas 39 a 44. Los hablantes de qom Julio Ramírez y Oswaldo Gómez se mencionan en el cuaderno.\u003cbr\u003eHK-NB-13.pdf - Cuaderno marca Bachiller de 50 páginas. Muchas páginas en blanco. El cuaderno de Klein que abarca actividades de trabajo de campo del 21 de junio de 1974 al 28 de junio de 1974. El hablante de qom Oswaldo Gómez se menciona en el cuaderno.\u003cbr\u003eHK-NB-11.pdf - Cuaderno marca Bachiller de 50 páginas. Muchas páginas en blanco. El libro 11 de Klein que abarca actividades de trabajo de campo el 25 de enero de 1972 y las grabaciones en las cintas 43 a 44. Algunas páginas parecen hacer referencia al trabajo de Reyburn en 1956, una breve gramática descriptiva del Toba (del dialecto de El Espinillo).\u003cbr\u003eHK-NB-06.pdf - Cuaderno marca Bachiller de 50 páginas. El libro 6 de Klein que abarca actividades de trabajo de campo durante un período de tiempo no específicado y al menos la grabación en la cinta 29A. Los hablantes de qom Ramón Corbalán, Nita Pérez, Abel Jorge Castro, Seferino Castro y Orlando Sánchez se mencionan en el cuaderno. Otros mencionados incluyen a Marcelo González, el vicepresidente de la comisión de Pampa del Indio, Julio Olivos, un pastor en Resistencia, y Juan E. Endiricio, un hablante de lengua de Fortín Lavalle.\u003cbr\u003eHK-NB-07.pdf - Cuaderno marca Bachiller de 50 páginas. El libro 7 de Klein que abarca actividades de trabajo de campo durante un período de tiempo no específicado y al menos la grabación de la cinta 29. Los hablantes de qom Abel Castro, Carlos Moreno, Evaristo Moreno, Juan Eduardo Enderecio, Nita Pérez, Seferino Castro, Marcelo González, Aurelio López, Oswaldoz, Godmez, Godmez, Godmez, y Julio Olivos se mencionan en el cuaderno.\u003cbr\u003eHK-NB-12.pdf - Cuaderno espiral marca Sarandi. Fichas están insertadas. El libro 12 de Klein que abarca actividades de trabajo de campo desde el 12 de junio de 1972 hasta el 24 de junio de 1972 y al menos la grabación de la cinta 46. Los hablantes de qom Ramón Corbalán y Oswaldo Gómez se mencionan en el cuaderno.\u003cbr\u003eHK-NB-15.pdf - Cuaderno marca América 2000 con imagen de un remero. El cuaderno de Klein que abarcan actividades de trabajo de campo desde el 10 de julio de 1987 hasta el 19 de julio de 1987 y las grabaciones en las cintas 1 a 7. Los hablantes de qom Oswaldo Gómez, Nieves Ramírez, Orlando Sánchez y José Patricio se mencionan en el cuaderno.\u003cbr\u003eHK-NB-02.pdf - Cuaderno marca Avon con puntos negros sobre un fondo blanco. Aparentemente, algunas resbalones de papel se insertaron como marcadores. El libro 2 de Klein que abarca actividades de trabajo de campo desde el 21 de agosto de 1971 hasta al menos el 29 de agosto de 1971 y las grabaciones en las cintas 5 a 8A.\u003cbr\u003eHK-NB-01.pdf - Cuaderno marca Avon con puntos negros sobre un fondo blanco. El libro 1 de Klein que abarca actividades de trabajo de campo del 11 de agosto de 1971 al 21 de agosto de 1971 y las grabaciones en las cintas 1 a 4. El hablante de qom Oswaldo Gómez se menciona en el cuaderno.\u003cbr\u003eHK-NB-K.pdf - El cuaderno verde y rojo que fue llevado durante la investigación de campo de Harriet Klein sobre Kadiwéu en Brasil. Algunas de las páginas iniciales tienen \"G. Griffiths 21/12/78\" inscritas en ellas--presumiblemente refiriéndose a una reunión entre Klein y Glyn Griffiths. El cuaderno cubre el trabajo de campo entre el 13 de diciembre de 1978 y el 16 de agosto (presumiblemente de 1979) y ocasionalmente presenta notas de Aspectos da Língua Kadiwéu (1976) por Glyn Griffiths y Cynthia Griffiths. La hablante de Kadiwéu, Albertina Méndez, se menciona en el cuaderno.\u003cbr\u003eHK-NB-14.pdf - Cuaderno marca Avon Flex con puntos negros sobre un fondo blanco. Se insertan varias hojas de ejemplos y notas recortadas. Klein's Notebook 1 que abarca actividades de trabajo de campo del 31 de julio de 1977 al 6 de agosto de 1977. El hablante de qom Ramón Corbalán se menciona en el cuaderno. Algunas páginas mencionan el vocabulario de E. Miller.","pt":"HK-NB-05.pdf - Bachiller 100 Page Notebook. Em branco, deslizamentos de papel inseridos como favoritos. O Livro de Klein 5 abrange as atividades de trabalho de campo de 9 de outubro de 1971 a 22 de novembro de 1971 e gravações nas fitas 22 a 31. Os alto -falantes Qom Oswaldo Gómez, Julio Ramírez e Nieves Ramírez são mencionados no caderno.\u003cbr\u003eHK-NB-04.pdf - Bachiller 100 Page Notebook. Lips de arquivos e folhas de anotações inseridas no notebook. O Livro de Klein 4 abrange as atividades de trabalho de campo de 17 de setembro de 1971 a 9 de outubro de 1971 e gravações nas fitas 14 a 22. Julio Ramírez, Adriano Ángel Canciano e Oswaldo Gómez são mencionados no caderno.\u003cbr\u003eHK-NB-09.pdf - Bachiller 100 Page Notebook. Lips de arquivos inseridos. O livro de Klein, 9, abrange as atividades de trabalho de campo de 20 de dezembro de 1971 a 12 de janeiro de 1972 e gravações nas fitas 34 a 39. Os alto -falantes Qom Oswaldo Gómez e Julio Ramírez são mencionados no caderno.\u003cbr\u003eHK-NB-03.pdf - Bachiller 100 Page Notebook. Marcador indica Informações de início do prefixo. Algumas folhas de notebook de tamanho de carta são grampeadas no caderno. O Livro de Klein 3 abrange as atividades de trabalho de campo de 30 de agosto de 1971 a pelo menos 15 de setembro de 1971 e gravações nas fitas 8 a 14. O presidente da Qom, Julio Ramírez, e alguns de seus membros de sua família são mencionados no caderno.\u003cbr\u003eHK-NB-08.pdf - Bachiller 100 Page Notebook. Nota folhas e deslizamentos de arquivo inseridos. O livro de Klein 8 abrange as atividades de trabalho de campo de 22 de novembro de 1971 a 20 de dezembro de 1971 e gravações nas fitas 28 a 34. Os alto -falantes Qom Oswaldo Gómez, Julio Ramírez, Marcelo González e Eduardo Ramírez são mencionados no notebook. Outros mencionados são Hilario Thomas, o general Cacique de Toba, e Pedro Martínez, um ex -general de Cacique.\u003cbr\u003eHK-NB-10.pdf - Bachiller 100 Page Notebook. O livro de Klein, 10, abrange as atividades de trabalho de campo de 12 de janeiro de 1972 a 25 de janeiro de 1972 e gravações nas fitas 39 a 44. O presidente da Qom, Julio Ramírez e Oswaldo Gómez, é mencionado no caderno.\u003cbr\u003eHK-NB-13.pdf - Bachiller 50 Page Notebook. Muitas páginas em branco. O caderno de Klein abrange as atividades de trabalho de campo de 21 de junho de 1974 a 28 de junho de 1974. O orador Qom Oswaldo Gómez é mencionado no caderno.\u003cbr\u003eHK-NB-11.pdf - Bachiller 50 Page Notebook. Muitas páginas em branco. O Livro de Klein 11 abrange as atividades de trabalho de campo em 25 de janeiro de 1972 e gravações nas fitas 43 a 44. Algumas páginas parecem referenciar o trabalho de Reyburn em 1956, uma curramática descritiva curta do Toba (dialeto El Espinillo).\u003cbr\u003eHK-NB-06.pdf - Bachiller 50 Page Notebook. O Livro de Klein 6 abrange as atividades de trabalho de campo durante um período de tempo e gravações não registradas em pelo menos fita 29a. O orador Qom Ramón Corbalán, Nita Pérez, Abel Jorge Castro, Seferino Castro e Orlando Sánchez é mencionado no caderno. Outros mencionados incluem Marcelo González, vice-presidente da comissão de Pampa Del Indio, Julio Olivos, pastor em Resistência e Juan E. Endiricio, um orador Lengua de Fortín Lavalle.\u003cbr\u003eHK-NB-07.pdf - Bachiller 50 Page Notebook. O Livro de Klein 7 abrange as atividades de trabalho de campo durante um período de tempo e gravações não registradas em pelo menos fita 29. Alto -falantes de qom Abel Castro, Carlos Moreno, Evaristo Moreno, Juan Eduardo Enderecio, Nita Pérez, Seferino Castro, Marcelo González, Aurelio, Aurelio, Aurelio, Ló, Ló, Castro, Marcelo González, Aurelio, Aurelio, Aurelio, Ló, Ló, Ló, Castro, Marcelo González, Aurelio, Aurelio, Lóz, Ló, Ló, Castro, Marcelo González, Aurelio, Aurelio, Aurelio, Ló, Ló, Ló, Castro, Marcelo González, Aurelio. E Julio Olivos é mencionado no caderno.\u003cbr\u003eHK-NB-12.pdf - Caderno em espiral de Sarandi. Inserido deslizamentos de papel. Livro de Klein 12 Atividades de trabalho de campo de 12 de junho de 1972 a 24 de junho de 1972 e gravações em pelo menos fita 46. Os alto -falantes Qom Ramón Corbalán e Oswaldo Gómez são mencionados no caderno.\u003cbr\u003eHK-NB-15.pdf - Notebook América 2000 com imagem de um remador. O caderno de Klein abrange as atividades de trabalho de campo de 10 de julho de 1987 a 19 de julho de 1987 e gravações nas fitas 1 a 7. Os alto -falantes Qom Oswaldo Gómez, Nieves Ramírez, Orlando Sánchez e José Patricio são mencionados no caderno.\u003cbr\u003eHK-NB-02.pdf - Notebook Avon com pontos pretos no fundo branco. Alguns deslizamentos de papel aparentemente inseridos como marcadores. O Livro de Klein 2 abrange as atividades de trabalho de campo de 21 de agosto de 1971 a pelo menos 29 de agosto de 1971 e gravações nas fitas 5 a 8a.\u003cbr\u003eHK-NB-01.pdf - Notebook Avon com pontos pretos no fundo branco. O Livro de Klein 1 abrange as atividades de trabalho de campo de 11 de agosto de 1971 a 21 de agosto de 1971 e gravações nas fitas 1 a 4. O orador Qom Oswaldo Gómez é mencionado no caderno.\u003cbr\u003eHK-NB-K.pdf - Notebook verde e vermelho transportado durante a pesquisa de campo sobre Kadiwéu no Brasil. Algumas das páginas iniciais têm\" G. Griffiths, 8/7/78 \", inscrevendo -se presumivelmente se referindo a uma reunião entre Harriet Klein e Glyn Griffiths. O notebook abrange o trabalho de campo entre 13 de dezembro de 1978 e 16 de agosto (presumivelmente 1979) e, ocasionalmente, apresenta as notas dos aspectos da língua Kadiwéu (1976) de 1979) de Glyn Griffiths e Cynthia Griffiths. O presidente da Kadiwéu, Albertina Méndez, é mencionado dentro do caderno.\u003cbr\u003eHK-NB-14.pdf - Notebook\" Avon Flex \"com pontos pretos em um fundo branco. Inserido são vá"},"last_updated":"2024-03-20T14:31:11.530498-05:00","user_last_updated":62,"visibility":"LOG","embargo_date":null,"date_created":19710811,"genre":[19],"genre_detail":[{"id":19,"name":{"id":75,"en":"Field notes","es":"Notas de campo","pt":"Notas de Campo"}}],"collection_item_id":{"id":843,"en":"Toba Collection of Harriet E. Manelis Klein","es":"Colección de Toba de Harriet E. Manelis Klein","pt":"Coleção Toba de Harriet E. Manelis Klein"},"folder_item_id":{"id":9155,"en":"Klein Chaco Notebooks","es":"Cuadernos del Chac
