ers providing answers wore a head-mounted Audio-Technica ATM73A unidirectional microphone. The original recordings were edited in Praat and restructured before being uploaded for archiving.\u003cbr\u003eUsp2017_QA_task_session_5.wav - Audio recording of the question-answer pair task. Questions were asked by a single native speaker of Uspanteko, and two other native speakers participated in turn providing answers to the questions. The recordings were made using a Zoom H5 portable recorder, on .wav format at at 48kHz sampling rate and 16 bit depth. The question-asker wore a head-mounted Nady HM-10 omnidirectional microphone, and the speakers providing answers wore a head-mounted Audio-Technica ATM73A unidirectional microphone. The original recordings were edited in Praat and restructured before being uploaded for archiving.\u003cbr\u003eUsp2017_QA_task_session_3.wav - Audio recording of the question-answer pair task. Questions were asked by a single native speaker of Uspanteko, and one other native speaker participated in turn providing answers to the questions. The recordings were made using a Zoom H5 portable recorder, on .wav format at at 48kHz sampling rate and 16 bit depth. The question-asker wore a head-mounted Nady HM-10 omnidirectional microphone, and the speaker providing answers wore a head-mounted Audio-Technica ATM73A unidirectional microphone. The original recordings were edited in Praat and restructured before being uploaded for archiving.\u003cbr\u003eQuestions1.pdf - A list of the questions and answers used in the experiment \"Focus prosody with controlled question-answer pairs\". Note that the questions and answers were randomized in presentation and so this list is not necessarily in order for each audio file.","es":"Usp2017_QA_task_session_1.wav - Una grabación de audio de la tarea de pregunta-respuesta. Las preguntas se hicieron por dos personas -- un hablante nativo del uspanteko, y un hablante NO NATIVO (macho) de uspanteko -- y las respuestas po raat e reestruturadas antes de serem carregadas para arquivar.\u003cbr\u003eUsp2017_QA_task_session_2.wav - Gravação de áudio da tarefa de pares de perguntas e respostas. As perguntas foram feitas por um único falante nativo de Uspanteko, e dois outros falantes nativos participaram, por sua vez, fornecendo respostas às perguntas. As gravações foram feitas usando um gravador portátil ZOOM H5, no formato .wav a uma taxa de amostragem de 48kHz e profundidade de 16 bits. O astro da pergunta usava um microfone omnidirecional Nady HM-10 montado na cabeça, e os alto-falantes que fornecem respostas usavam um microfone unidirecional de áudio-technica montado na cabeça. As gravações originais foram editadas em Praat e reestruturadas antes de serem carregadas para arquivar.\u003cbr\u003eUsp2017_QA_task_session_4.wav - Gravação de áudio da tarefa de pares de perguntas e respostas. As perguntas foram feitas por um único falante nativo de Uspanteko, e dois outros falantes nativos participaram, por sua vez, fornecendo respostas às perguntas. As gravações foram feitas usando um gravador portátil ZOOM H5, no formato .wav a uma taxa de amostragem de 48kHz e profundidade de 16 bits. O astro da pergunta usava um microfone omnidirecional Nady HM-10 montado na cabeça, e os alto-falantes que fornecem respostas usavam um microfone unidirecional de áudio-technica montado na cabeça. As gravações originais foram editadas em Praat e reestruturadas antes de serem carregadas para arquivar.\u003cbr\u003eUsp2017_QA_task_session_5.wav - Gravação de áudio da tarefa de pares de perguntas e respostas. As perguntas foram feitas por um único falante nativo de Uspanteko, e dois outros falantes nativos participaram, por sua vez, fornecendo respostas às perguntas. As gravações foram feitas usando um gravador portátil ZOOM H5, no formato .wav a uma taxa de amostragem de 48kHz e profundidade de 16 bits. O astro da pergunta usava um microfone omnidirecional Nady HM-10 montado na cabeça, e os alto-falantes que
