enous_description":"","indigenous_description_language":null,"parent_folder":6701,"description":{"id":31048,"en":"022_Mama_Clara_Mainato_sings_Caminata_and_Cuchunchi.mov - Mama Clara Mainato sings El Tigre, Caminata, and Cuchunchi, the traditional wedding song that describes all that is expected of the bride and groom. She demonstrates part of the dance that the godparents perform to show the bridal couple the jobs they must do once married. Filmed by Judy Blankenship. Correucu, Cañar.\u003cbr\u003e025_Mama_Juana_Chuma_Pichisaca_sings_carnival_songs,_Part_2.mov - Mama Juana Chuma Pichisaca sings traditional songs with family gathered around. Filmed by Judy Blankenship with Mercedes Guamán Mayancela and Ryan Comandich. Quilloac, Cañar.\u003cbr\u003e051_Mama_Juana_Chuma_Pichisaca_sings_carnival_songs,_Part_3.mov - Mama Juana Chuma Pichisaca sings traditional songs with family gathered around. Filmed by Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e024_Mama_Juana_Chuma_Pichisaca_sings_carnival_songs,_Part_1.mov - Mama Juana Chuma Pichisaca, wearing an elaborate Carnival sombrero, sings Carnival songs. Filmed by Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e023_Maria_Clara_Maintano_sings_traditional_songs.mov - María Clara Mainato, Mama Clara's daughter, sings - subject unknown.\u003cbr\u003e044_Pedro_Pichisaca_Doncón_and_musical_group,_with_family_and_neighbors,_Part_2.mov - Teacher and musician Pedro Pichisaca Doncón with his family and musicians in Cuchucún, music and dancing, walking through countryside, accompanied by children and animals and others. Filmed by Judy Blankenship. Cuchucún, Cañar.\u003cbr\u003e043_Pedro_Pichisaca_Doncón_and_musical_group,_with_family_and_neighbors,_Part_1.mov - Teacher and musician Pedro Pichisaca Doncón recounts the history of his community, Cuchucún. He speaks of illegal migration, education, and how community activities create unity to support the culture. From his donkey, which he rides because of a physical disability, he introduces us to the landscape of Cuchucún, his family and his musical group. The group plays in the open air. Filmed by Judy Blankenship with José Miguel Acero. Cuchucún, Cañar.\u003cbr\u003e047_Belisario_Guamán_playing_bocino_(long_horn).mov - Tayta Belisario Lilhuisaca Guamán talks about and blows the traditional \"bocino\" or Cañari longhorn. Filmed by Judy Blankenship with José Miguel Acero. Shizu, Cañar.","es":"022_Mama_Clara_Mainato_sings_Caminata_and_Cuchunchi.mov - Mama Clara Mainato canta El Tigre, Caminata y Cuchunchi, el tradicional canto nupcial que describe todo lo que se espera de los novios. Demuestra parte del baile que deben realizar los padrinos para mostrar a los novios todo el trabajo que deben hacer una vez casados. Grabado por Judy Blankenship. Correucu, Cañar.\u003cbr\u003e025_Mama_Juana_Chuma_Pichisaca_sings_carnival_songs,_Part_2.mov - Mama Juana Chuma Pichisaca canta canciones tradicionales con la familia alredador. Grabado por Judy Blankenship con Mercedes Guamán Mayancela y Ryan Comandich. Quilloac, Cañar.\u003cbr\u003e051_Mama_Juana_Chuma_Pichisaca_sings_carnival_songs,_Part_3.mov - Mama Juana Chuma Pichisaca canta canciones tradicionales con la familia reunida. Grabado por Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e024_Mama_Juana_Chuma_Pichisaca_sings_carnival_songs,_Part_1.mov - Mama Juana Chuma Pichisaca, vestida con un gran sombrero usado para Canaval, canta canciones de Carnaval. Grabado por Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e023_Maria_Clara_Maintano_sings_traditional_songs.mov - María Clara Mainato, hija de Mama Clara, canta - tema desconocido.\u003cbr\u003e044_Pedro_Pichisaca_Doncón_and_musical_group,_with_family_and_neighbors,_Part_2.mov - El maestro y músico Pedro Pichisaca Doncón con su familia y músicos en Cuchucún, música y baile, caminando por el campo, acompañado de niños y animales y otros. Grabado por Judy Blankenship. Cuchucún, Cañar.\u003cbr\u003e043_Pedro_Pichisaca_Doncón_and_musical_group,_with_family_and_neighbors,_Part_1.mov - El maestro y músico Pedro Pichisaca Doncón relata la historia de su comunidad, Cuchucún. Habla de migración ilegal, educación y cómo las actividades comunitarias crean unidad para apoyar la cultura. Desde su burro, que monta por una discapacidad física, nos introduce en el paisaje de Cuchucún, su familia y su grupo musical. El grupo juega al aire libre. Grabado por Judy Blankenship con José Miguel Acero. Cuchucún, Cañar.\u003cbr\u003e047_Belisario_Guamán_playing_bocino_(long_horn).mov - Tayta Belisario Lilhuisaca Guamán habla y sopla el tradicional \"bocino\" cañari. Grabado por Judy Blankenship con José Miguel Acero. Shizu, Cañar.","pt":"022_Mama_Clara_Mainato_sings_Caminata_and_Cuchunchi.mov - Mama Clara Mainato canta El Tigre, Caminata e Cuchunchi, a canção tradicional de casamento que descreve tudo o que se espera da noiva e do noivo. Ela demonstra parte da dança que os padrinhos realizam para mostrar ao casal nupcial os empregos que devem fazer uma vez casados. Filmado por Judy Blankenship. Correucu, Cañar.\u003cbr\u003e025_Mama_Juana_Chuma_Pichisaca_sings_carnival_songs,_Part_2.mov - Mama Juana Chuma Pichisaca canta músicas tradicionais com a família reunida. Filmado por Judy Blankenship com Mercedes Guamán Mayancela e Ryan Comandich. Quilloac, Cañar.\u003cbr\u003e051_Mama_Juana_Chuma_Pichisaca_sings_carnival_songs,_Part_3.mov - Mama Juana Chuma Pichisaca canta músicas tradicionais com a família reunida. Filmado por Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e024_Mama_Juana_Chuma_Pichisaca_sings_carnival_songs,_Part_1.mov - Mama Juana Chuma Pichisaca, usando um elaborado carnaval Sombrero, canta músicas de carnaval. Filmado por Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e023_Maria_Clara_Maintano_sings_traditional_songs.mov - María Clara Mainato, filha de Mama Clara, canta - sujeito desconhecido.\u003cbr\u003e044_Pedro_Pichisaca_Doncón_and_musical_group,_with_family_and_neighbors,_Part_2.mov - Professor e músico Pedro Pichisaca Doncón com sua família e músicos em Cuchucún, música e dança, caminhando pelo campo, acompanhado por crianças e animais e outros. Filmado por Judy Blankenship. Cuchucún, Cañar.\u003cbr\u003e043_Pedro_Pichisaca_Doncón_and_musical_group,_with_family_and_neighbors,_Part_1.mov - Professor e músico Pedro Pichisaca Doncón relata a história de sua comunidade, Cuchucún. Ele fala de migração ilegal, educação e como as atividades da comunidade criam unidade para apoiar a cultura. De seu burro, que ele monta por causa de uma deficiência física, ele nos apresenta a paisagem de Cuchucún, sua família e seu grupo musical. O grupo toca ao ar livre. Filmado por Judy Blankenship com José Miguel Acero. Cuchucún, Cañar.\u003cbr\u003e047_Belisario_Guamán_playing_bocino_(long_horn).mov - Tayta Belisario Lilhuisaca Guamán fala e sopra o tradicional\" Bocino \"ou Cañari Longhorn. Filmado por Judy Blankenship com José Miguel Acero. Shizu, Cañar."},"last_updated":"2024-04-19T12:53:11.906455-05:00","user_last_updated":62,"visibility":"LOG","embargo_date":null,"date_created":20000000,"genre":[18,46],"genre_detail":[{"id":18,"name":{"id":73,"en":"Ethnography","es":"Etnografía","pt":"Etnografia"}},{"id":46,"name":{"id":129,"en":"Song","es":"Canción","pt":"Canção"}}],"collection_item_id":{"id":722,"en":"Cañar Collection of Judy Blankenship","es":"Colección de Cañar de Judy Blankenship","pt":"Coleção Cañar de Judy Blankenship"},"folder_item_id":{"id":6701,"en":"Videos - Cañari Music and Dance","es":"Videos - Música y baile cañaries","pt":"Vídeos - música cañari e dança"},"files":[{"id":78121,"legacy_id":"","islandora_pid":"ailla:279623","parent_item":7201,"item_file_id":{"id":7201,"en":"Videos - Cañari Music and Dance","es":"Videos - Música y baile cañaries","pt":"Vídeos - música cañari e dança"},"filename":"022_Mama_Clara_Mainato_sings_Caminata_and_Cuchunchi.mov","media_language":[232,9],"media_language_detail":[{"id":232,"name":{"id":822,"en":"Kichwa, Cañar Highland","es":"quichua de alto Cañ
