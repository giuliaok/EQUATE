","indigenous_name_language":null,"indigenous_description":"","indigenous_description_language":null,"parent_folder":6703,"description":{"id":31056,"en":"041_Carnival_preparations_with_Mama_Michi_and_neighbors_in_Correucu,_Part_1.mov - The family of Mama Michi (Mercedes Chuma Quishpilema) and neighbors prepare for Carnival with special clothing, musical instruments and children singing, as they prepare for a procession from their house to the Indigenous center in town. There, Pablo Acero performs a ceremony before the larger procession begins to the communities in the countryside celebrating Carnival. Filmed by Judy Blankenship. Cañar, Cañar.\u003cbr\u003e006_Canari_Day_at_Ingapirca.mov - Chaskis Foundation of Cañar presents music, dance, rituals, food and a cultural exhibit at Ingapirca archeological complex. Judy Blankenship talks about the photo exhibit. Filmed by Judy Blankenship. Ingapirca, Cañar.\u003cbr\u003e042_Carnival_mass_and_sacrifice_of_cow_in_Correucu,_Part_2.mov - After a short mass in the Correucu community center, neighbors gather to \"sacrifice\" a cow for the Carnival celebration the next day when the community will host a celebration with thousands of \"Carnavaleros.\" The men butcher the cow in front of the community center, with ritual drinks of alcohol and the cow's blood. After, men and women dance to live music, while one man whirls around with a large strip of meat that represents the wings of a condor. Filmed by Judy Blankenship. Correucu, Cañar.\u003cbr\u003e039_Cañari_wedding_procession,_Part_2.mov - Young couple Beatriz Quishpilema and Nicolás Guamán in nighttime wedding procession with godparents, family and neighbors, around the town with accordionist. Filmed by Judy Blankenship. Cañar, Cañar.\u003cbr\u003e038_Cañari_wedding_in_the_Catholic_church,_Part_1.mov - Young couple Beatriz Quishpilema and Nicolás Guamán marry in the Catholic church with godparents, family and neighbors, followed by a procession in the town with an accordionist. Filmed by Judy Blankenship. Cañar, Cañar.\u003cbr\u003e021_Ritual_placing_on_cross_on_roof_during_house_construction.mov - Neighbors gather for the traditional placing of a cross on the roof of a house under construction. The ritual includes praying, dancing, music, godparents climbing to the rooftop to place the cross, then throwing candies down to the neighbors and children below. Filmed by Judy Blankenship. Chaglaban, Cañar.","es":"041_Carnival_preparations_with_Mama_Michi_and_neighbors_in_Correucu,_Part_1.mov - La familia de Mama Michi (Mercedes Chuma Quishpilema) y los vecinos se preparan para el Carnaval con ropa especial, instrumentos musicales y niños cantando, listos para una procesión desde su casa hasta el centro indígena de la ciudad. Allí, Pablo Acero realiza una ceremonia antes de que comience la procesión más grande a las comunidades en el campo que celebran el Carnaval. Grabado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e006_Canari_Day_at_Ingapirca.mov - Fundación Chaskis de Cañar presenta música, baile, rituales, comida y una exhibición cultural en el complejo arqueológico de Ingapirca. Grabado por Judy Blankenship. Ingapirca, Cañar.\u003cbr\u003e042_Carnival_mass_and_sacrifice_of_cow_in_Correucu,_Part_2.mov - Luego de una breve misa en el centro comunal de Correucu, los vecinos se reúnen para \"sacrificar\" una vaca para la celebración del Carnaval del día siguiente, cuando la comunidad será la sede de una celebración de miles de \"Carnavaleros\". Los hombres matan a la vaca frente al centro comunitario, con bebidas rituales de alcohol y sangre de la vaca. Después los hombres y mujeres bailan a música en vivo, mientras un hombre gira con una gran tira de carne que representa las alas de un cóndor. Grabado por Judy Blankenship. Correucu, Cañar.\u003cbr\u003e039_Cañari_wedding_procession,_Part_2.mov - Pareja joven Beatriz Quishpilema y Nicolás Guamán en procesión nupcial nocturna con padrinos, familiares y vecinos, por el pueblo con acordeonista. Grabado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e038_Cañari_wedding_in_the_Catholic_church,_Part_1.mov - La joven pareja Beatriz Quishpilema y Nicolás Guamán se casan en la iglesia católica con padrinos, familiares y vecinos, seguido de una procesión en el pueblo con un acordeonista. Grabado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e021_Ritual_placing_on_cross_on_roof_during_house_construction.mov - Los vecinos se reúnen para la tradicion de colocar una cruz en el techo de una casa en construcción. El ritual incluye rezar, bailar, música, los padrinos suben al techo para colocar la cruz y luego arrojan caramelos a los vecinos y niños en el suelo. Grabado por Judy Blankenship. Chaglaban, Cañar.","pt":"041_Carnival_preparations_with_Mama_Michi_and_neighbors_in_Correucu,_Part_1.mov - A família de Mama Michi (Mercedes Chuma Quishpilema) e os vizinhos se preparam para o carnaval com roupas especiais, instrumentos musicais e crianças cantando, enquanto se preparam para uma procissão de sua casa para o centro indígena da cidade. Lá, Pablo Acero realiza uma cerimônia antes que a maior procissão comece às comunidades do campo comemorando o carnaval. Filmado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e006_Canari_Day_at_Ingapirca.mov - A Fundação Chaskis de Cañar apresenta música, dança, rituais, comida e uma exposição cultural no Ingapirca Archeological Complex. Judy Blankenship fala sobre a exposição de fotos. Filmado por Judy Blankenship. Ingapirca, Cañar.\u003cbr\u003e042_Carnival_mass_and_sacrifice_of_cow_in_Correucu,_Part_2.mov - Depois de uma missa curta no Centro Comunitário Correucu, os vizinhos se reúnem para\" sacrificar \"uma vaca para a celebração do carnaval no dia seguinte, quando a comunidade sediará uma celebração com milhares de\" Carnavaleros \". centro, com bebidas rituais de álcool e o sangue da vaca. Depois, homens e mulheres dançam para música ao vivo, enquanto um homem gira com uma grande faixa de carne que representa as asas de um condor. Filmado por Judy Blankenship. Correucu , Cañar.\u003cbr\u003e039_Cañari_wedding_procession,_Part_2.mov - O jovem casal Beatriz Quishpilema e Nicolás Guamán em procissão noturna de casamento com padrinhos, família e vizinhos, ao redor da cidade com acordeonista. Filmado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e038_Cañari_wedding_in_the_Catholic_church,_Part_1.mov - O jovem casal Beatriz Quishpilema e Nicolás Guamán se casam na Igreja Católica com padrinhos, família e vizinhos, seguidos de uma procissão na cidade com um acordeonista. Filmado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e021_Ritual_placing_on_cross_on_roof_during_house_construction.mov - Os vizinhos se reúnem para a colocação tradicional de uma cruz no telhado de uma casa em construção. O ritual inclui orar, dançar, música, padrinhos escalando para o telhado para colocar a cruz, depois jogando doces até os vizinhos e crianças abaixo. Filmado por Judy Blankenship. Chaglaban, Cañar."},"last_updated":"2024-04-19T12:53:10.472615-05:00","user_last_updated":62,"visibility":"LOG","embargo_date":null,"date_created":20000000,"genre":[18],"genre_detail":[{"id":18,"name":{"id":73,"en":"Ethnography","es":"Etnografía","pt":"Etnografia"}}],"collection_item_id":{"id":722,"en":"Cañar Collection of Judy Blankenship","es":"Colección de Cañar de Judy Blankenship","pt":"Coleção Cañar de Judy Blankenship"},"folder_item_id":{"id":6703,"en":"Videos - Cañari Rituals and Cultural Events","es":"Videos - Rituales y eventos culturales cañaries","pt":"Vídeos - Rituais Cañari e Eventos Culturais"},"files":[{"id":78197,"legacy_id":"","islandora_pid":"ailla:279633","parent_item":7203,"item_file_id":{"id":7203,"en":"Videos - Cañari Rituals and Cultural Events","es":"Videos - Rituales y eventos culturales cañaries","pt":"Vídeos - Rituais Cañari e Eventos Culturais"},"filename":"021_Ritual_placing_on_cross_on_roof_during_house_construction.mov","media_language":[232],"media_language_detail":[{"id":232,"name":{"
