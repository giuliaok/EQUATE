indigenous_description":"","indigenous_description_language":null,"parent_folder":5667,"description":{"id":26995,"en":"AAA2017_Nash_AudioVideo.pdf - This presentation describes technical requirements for creating good audio and video recordings as part of language documentation work. This presentation was part of the workshop \"Technical Methodologies in Language Documentation and Anthropology,\" which was held on Wednesday, November 29, 2017, in Washington, D.C., USA, as part of the Annual Meeting of the American Anthropological Association (AAA). The workshop was funded by the Documenting Endangered Languages Program of the National Science Foundation under grant no. 1744248 (https://www.nsf.gov/awardsearch/showAward?AWD_ID=1744248).","es":"AAA2017_Nash_AudioVideo.pdf - Esta ponencia describe los requisitos técnicos para crear buenas grabaciones de audio y video como parte del trabajo de documentación del idioma. Esta presentación fue parte del taller \"Metodologías Técnicas en la Documentación Lingüística y Antropología,\" que se llevó a cabo el miércoles 29 de noviembre de 2017, en Washington, DC, EE.UU., como parte de la Reunión Anual de la Asociación Americana de Antropología (AAA). El taller fue financiado por el Programa de Documentación de Lenguas en Peligro de la Fundación Nacional de Ciencias con la subvención número 1744248 (https://www.nsf.gov/awardsearch/showAward?AWD_ID=1744248).","pt":"AAA2017_Nash_AudioVideo.pdf - Esta apresentação descreve os requisitos técnicos para criar boas gravações de áudio e vídeo como parte do trabalho de documentação de idiomas. Esta apresentação fazia parte do workshop \"Metodologias Técnicas em Documentação e Antropologia de Idiomas\", realizada na quarta -feira, 29 de novembro de 2017, em Washington, DC, EUA, como parte da reunião anual da American Anthropological Association (AAA). O workshop foi financiado pelo programa de idiomas em extinção da documentação da National Science Foundation sob Grant no. 1744248 (https:
