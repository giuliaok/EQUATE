s_name":"","indigenous_name_language":null,"indigenous_description":"","indigenous_description_language":null,"parent_folder":6706,"description":{"id":31068,"en":"036_Nurse_Mariana_Chuma_treats_firework_injury_in_village_clinic.mov - Nurse and midwife Mariana Chuma Quishpilema attends to a man in her village clinic whose finger has been blown off by a firework some weeks before. Filmed by Judy Blankenship. Cuchucún, Cañar.\u003cbr\u003e037_Nurse_and_midwife_Mariana_Chuma_attends_home_birth.mov - Nurse and midwife Mariana Chuma Quishpilema attends to a home birth, with use of medicinal plants, ritual practices and some western medicine skills. Filmed by Judy Blankenship. Correucu, Cañar.\u003cbr\u003e033_Traditional_healer_Mama_Michi_sorting_\u0026_drying_medicinal_plants.mov - Mama Michi (Mercedes Chuma Quishpilema) sorts the dried medicinal plants she has bought in Cuenca in the yard at her house, while Judy Blankenship interviews. She is joined by her mother, Vicenta Quishpilema Pichisaca, her grandchildren Pacari and Rantin, and her nephew Ranti Chuma. With the plants Mama Michi will prepare medicinal teas for her jambi wasi - healing center in Cañar.. Filmed by Judy Blankenship. Correucu, Cañar, Cañar.\u003cbr\u003e034_Traditional_healer_Mama_Michi_treats_patients_in_her_home.mov - Mama Michi (Mercedes Chuma Quishpilema) greets patients waiting outside her house, checks their pulses and chats while granddaughter Pacari plays around. Inside her earthen-floor house, Mama Michi treats an older woman with a massage using medicinal potions and plants. Filmed by Judy Blankenship. Correucu, Cañar.\u003cbr\u003e027_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_2.mov - Mama Michi (Mercedes Chuma Quishpilema) and her son Pablo Acero diagnose a patient using a guinea pig. Mama Michi does a curación of a migrant in the U.S. using his photograph. Her assistant Virginia Caizan sells patent medicines to patients. Filmed by Judy Blankenship. Cañar, Cañar.\u003cbr\u003e028_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_3.mov - Mama Michi (Mercedes Chuma Quishpilema) in her jambi wasi seeing women and children. Patients waiting examine a bulletin board with photos of a country birth attended by Mama Michi and her sister Mariana Chuma Quishpilema, taken by Judy Blankenship. Filmed by Judy Blankenship. Cañar, Cañar.\u003cbr\u003e010_El_Cinco_ritual_with_midwife_Mariana_Chuma.mov - Mariana Chuma Quishpilema, midwife and nurse, tends to a new mother on day five after birth, known as El Cinco, during which the baby is unswaddled and bathed for the first time, and the mother is wrapped tightly in a shawl to protect her uterus. Filmed by Judy Blankenship. Correoucu, Cañar.\u003cbr\u003e030_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_5.mov - A day with healer Mama Michi (Mercedes Chuma Quishpilema) at her jambi wasi in Cañar, diagnosing and treating women and children, preparing medicinal plants, selling patent medicines, with help from her son, Pablo Acero. Filmed by Judy Blankenship. Cañar, Cañar.\u003cbr\u003e031_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_6.mov - A day with healer Mama Michi (Mercedes Chuma Quishpilema) at her jambi wasi in Cañar, diagnosing and treating women and children, and performing a ritual blessing for two young men getting ready to make the dangerous and illegal migration to the U.S. Filmed by Judy Blankenship. Cañar, Cañar.\u003cbr\u003e029_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_4.mov - A day with healer Mama Michi (Mercedes Chuma Quishpilema) at her jambi wasi in Cañar, diagnosing and treating women and children. Filmed by Judy Blankenship. Cañar, Cañar.\u003cbr\u003e026_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_1.mov - A day with healer Mama Michi (Mercedes Chuma Quishpilema) at her jambi wasi (healing house) in Cañar, diagnosing and treating women, children and men, buying patent medicines from a salesman, and mixing medicinal drinks. Her son Pablo Acero Chuma does a diagnostic ritual with a guinea pig. Filmed by Judy Blankenship. Cañar.\u003cbr\u003e032_Traditional_healer_Mama_Michi_buying_medicinal_plants_in_Cuenca_market.mov - A day with healer Mama Michi (Mercedes Chuma Quishpilema) at the market in Cuenca, buying medicinal plants. Judy Blankenship follows her around and asks questions. Filmed by Judy Blankenship. Cuenca, Azuay.","es":"036_Nurse_Mariana_Chuma_treats_firework_injury_in_village_clinic.mov - La enfermera y comadrona Mariana Chuma Quishpilema atiende a un hombre en su clínica en el pueblo al que un fuego artificial le arrancó el dedo unas semanas antes. Grabado por Judy Blankenship. Cuchucún, Cañar.\u003cbr\u003e037_Nurse_and_midwife_Mariana_Chuma_attends_home_birth.mov - La enfermera y partera Mariana Chuma Quishpilema atiende un parto en casa, con uso de plantas medicinales, prácticas rituales y algunas habilidades de la medicina occidental. Grabado por Judy Blankenship. Correucu, Cañar.\u003cbr\u003e033_Traditional_healer_Mama_Michi_sorting_\u0026_drying_medicinal_plants.mov - Mama Michi (Mercedes Chuma Quishpilema) clasifica las plantas medicinales secas que compró en Cuenca en el patio de su casa, mientras Judy Blankenship la entrevista. A ella se unen su madre, Vicenta Quishpilema Pichisaca, sus nietos Pacari y Rantin, y su sobrino Ranti Chuma. Con las plantas Mama Michi preparará brebajes para su jambi wasi - centro de curación en Cañar. Grabado por Judy Blankenship. Correucu, Cañar.\u003cbr\u003e034_Traditional_healer_Mama_Michi_treats_patients_in_her_home.mov - Mama Michi (Mercedes Chuma Quishpilema) saluda a los pacientes que esperan fuera de su casa, les revisa el pulso y charla mientras su nieta Pacari juega. Dentro de su casa con piso de barro, trata a una mujer mayor con un masaje con pociones y plantas medicinales.. Grabado por Judy Blankenship. Correucu, Cañar.\u003cbr\u003e027_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_2.mov - Mama Michi (Mercedes Chuma Quishpilema) y su hijo Pablo Acero diagnostican a un paciente con un conejillo de indias - cuy. Mama Michi hace una curación de un hombre migrante en los Estados Unidos usando su fotografía. Su ayudante Virginia Caizan vende medicamentos patentados a pacientes. Grabado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e028_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_3.mov - Mama Michi en su jambi wasi viendo mujeres y niños. Los pacientes que esperan examinan un tablero de anuncios con fotos de un nacimiento en el campo atendido por Mama Michi y su hermana Mariana Chuma Quishpilema, tomadas por Judy Blankenship. Grabado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e010_El_Cinco_ritual_with_midwife_Mariana_Chuma.mov - Mariana Chuma, partera y enfermera, atiende a una nueva madre con el ritual conocido como El Cinco, durante el cual se desenrolla y se baña al bebé por primera vez, y se envuelve a la madre en un chal para proteger su útero. Grabado por Judy Blankenship. Correoucu, Cañar.\u003cbr\u003e030_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_5.mov - Un día con la curandera Mama Michi (Mercedes Chuma Quishpilema) en su jambi wasi en Cañar, diagnosticando y tratando a mujeres y niños, preparando plantas medicinales, vendiendo medicinas patentadas, con la ayuda de su hijo, Pablo Acero. Grabado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e031_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_6.mov - Un día con la curandera Mama Michi (Mercedes Chuma Quishpilema) en su jambi wasi en Cañar, diagnosticando y tratando a mujeres y niños, y realizando una bendición ritual para dos jóvenes que se preparan para realizar la peligrosa e ilegal migración a los Estados Unidos. Grabado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e029_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_4.mov - Un día con la curandera Mama Michi (Mercedes Chuma Quishpilema) en su jambi wasi en Cañar, diagnosticando y tratando a mujeres y niños. Grabado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e026_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_1.mov - Un día con la curandera Mama Michi (Mercedes Chuma Quishpilema) en su jambi wasi (casa de curación) en Cañar, diagnosticando y tratando a mujeres, niños y hombres, comprando medicinas patentadas de un vendedor y mezclando bebidas medicinales. Su hijo Pablo Acero Chuma hace un ritual de diagnóstico con un cuy. Grabado por Judy Blankenship. Cañar.\u003cbr\u003e032_Traditional_healer_Mama_Michi_buying_medicinal_plants_in_Cuenca_market.mov - Un día con la curandera Mama Michi (Mercedes Chuma Quishpilema) en el mercado de Cuenca, comprando plantas medicinales. Judy Blankenship la sigue y le hace preguntas. Grabado por Judy Blankenship. Cuenca, Azuay.","pt":"036_Nurse_Mariana_Chuma_treats_firework_injury_in_village_clinic.mov - A enfermeira e a parteira Mariana Chuma Quishpilema atende a um homem em sua clínica de vila cujo dedo foi explodido por um fogo de artifício algumas semanas antes. Filmado por Judy Blankenship. Cuchucún, Cañar.\u003cbr\u003e037_Nurse_and_midwife_Mariana_Chuma_attends_home_birth.mov - A enfermeira e parteira Mariana Chuma Quishpilema atende a um parto em casa, com o uso de plantas medicinais, práticas rituais e algumas habilidades de medicina ocidental. Filmado por Judy Blankenship. Correucu, Cañar.\u003cbr\u003e033_Traditional_healer_Mama_Michi_sorting_\u0026_drying_medicinal_plants.mov - Mama Michi (Mercedes Chuma Quishpilema) classifica as plantas medicinais secas que ela comprou em Cuenca no quintal de sua casa, enquanto Judy Blankenship entrevistas. Ela se junta à mãe, Vicenta Quishpilema Pichisaca, seus netos Pacari e Rantin e seu sobrinho Ranti Chuma. Com as plantas, a Mama Michi preparará chás medicinais para o seu Jambi Wasi - Centro de Cura em Cañar .. filmado por Judy Blankenship. Correucu, Cañar, Cañar.\u003cbr\u003e034_Traditional_healer_Mama_Michi_treats_patients_in_her_home.mov - Mama Michi (Mercedes Chuma Quishpilema) cumprimenta pacientes que esperam do lado de fora de sua casa, verifica seus pulsos e bate -papos enquanto a neta Pacari brinca. Dentro de sua casa de terra, Mama Michi trata uma mulher mais velha com uma massagem usando poções e plantas medicinais. Filmado por Judy Blankenship. Correucu, Cañar.\u003cbr\u003e027_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_2.mov - Mama Michi (Mercedes Chuma Quishpilema) e seu filho Pablo Acero diagnosticaram um paciente usando um porquinho -da -índia. Mama Michi faz uma curación de um migrante nos EUA usando sua fotografia. Sua assistente Virginia Caizan vende medicamentos de patentes para pacientes. Filmado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e028_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_3.mov - Mama Michi (Mercedes Chuma Quishpilema) em seu jambi wasi vendo mulheres e crianças. Pacientes que esperam examinam um conselho de aviso com fotos de um nascimento de um país com a presença de Mama Michi e sua irmã Mariana Chuma Quishpilema, tomada por Judy Blankenship. Filmado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e010_El_Cinco_ritual_with_midwife_Mariana_Chuma.mov - Mariana Chuma Quishpilema, parteira e enfermeira, tende a uma nova mãe no dia cinco após o nascimento, conhecida como El Cinco, durante a qual o bebê não se sabe e banhou pela primeira vez, e a mãe está enrolada firmemente em um xale para proteger seu útero . Filmado por Judy Blankenship. Correoucu, Cañar.\u003cbr\u003e030_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_5.mov - Um dia com a curandeira Mama Michi (Mercedes Chuma Quishpilema) em seu jambi wasi em Cañar, diagnosticando e tratando mulheres e crianças, preparando plantas medicinais, vendendo medicamentos de patentes, com a ajuda de seu filho, Pablo Acero. Filmado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e031_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_6.mov - Um dia com o curandeiro Mama Michi (Mercedes Chuma Quishpilema) em seu jambi wasi em Cañar, diagnosticando e tratando mulheres e crianças e realizando uma bênção ritual para dois jovens se preparando para tornar a migração perigosa e ilegal para os EUA filmados por Judy Blankenship . Cañar, Cañar.\u003cbr\u003e029_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_4.mov - Um dia com o curandeiro Mama Michi (Mercedes Chuma Quishpilema) em seu jambi wasi em Cañar, diagnosticando e tratando mulheres e crianças. Filmado por Judy Blankenship. Cañar, Cañar.\u003cbr\u003e026_Traditional_healer_Mama_Michi_in_her__jambi_wasi,__Part_1.mov - Um dia com o curandeiro Mama Michi (Mercedes Chuma Quishpilema) em sua jambi wasi (Casa de Cura) em Cañar, diagnosticando e tratando mulheres, crianças e homens, comprando medicamentos de patentes de um vendedor e misturando bebidas medicinais. Seu filho Pablo Acero Chuma faz um ritual de diagnóstico com uma cobaia. Filmado por Judy Blankenship. Cañar.\u003cbr\u003e032_Traditional_healer_Mama_Michi_buying_medicinal_plants_in_Cuenca_market.mov - Um dia com o curandeiro Mama Michi (Mercedes Chuma Quishpilema) no mercado em Cuenca, comprando plantas medicinais. Judy Blankenship a segue e faz perguntas. Filmado por Judy Blankenship. Cuenca, Azuay."},"last_updated":"2024-05-02T12:56:26.769026-05:00","user_last_updated":62,"visibility":"LOG","embargo_date":null,"date_created":20000000,"genre":[18],"genre_detail":[{"id":18,"name":{"id":73,"en":"Ethnography","es":"Etnografía","pt":"Etnografia"}}],"collection_item_id":{"id":722,"en":"Cañar Collection of Judy Blankenship","es":"Colección de Cañar de Judy Blankenship","pt":"Coleção Cañar de Judy Blankenship"},"folder_item_id":{"id":6706,"en":"Videos - Cañari Traditional Medicine and Healing","es":"Videos - Medicina y curación tradicionales cañaries","pt":"Vídeos - Cañari Medicina e Cura Tradicional"},"files":[{"id":78354,"legacy_id":"","islandora_pid":"ailla:279654","parent_item":7206,"item_file_id":{"id":7206,"en":"Videos - Cañari Traditional Medicine and Healing","es":"Videos - M
