wan","indigenous_name_language":{"id":89,"name":{"id":536,"en":"Quechua, Cuzco","es":"quechua cuzqueño","pt":"quíchua de Cusco"},"language_code":"quz"},"indigenous_description":"","indigenous_description_language":null,"parent_folder":9396,"description":{"id":41644,"en":"MUL028R041I005.mp4 - Hipólito Peralta Ccama sits with Ignacio Quispe Huisa, who reads aloud a letter soliciting authorization to conduct research, states his name and says that he would like people to speak to his children only in Quechua.\u003cbr\u003e41QutaIgnacioCP.pdf - Process of creation: Susan Kalt asked Janett Vengoa to select ‘successful’ narratives based on the duck story at the end of each interview (see last two pages of MUL028R111 in this collection). The criterion for success was that the interviewer limited his interventions to infrequent prompts rather than long explanations and frequent questions, and that the person interviewed did most of the talking. Unsuccessful narratives were characterized by long silences and a near one-to-one correspondence between the number of interviewer questions and child responses. Vengoa transcribed and translated this narrative to Spanish using a modified CHILDES format. This media file is a transcript of a ‘successful’ narrative, but It was not transcribed in time to be included in the analysis presented in (2015) Kalt, Susan “Pointing in space and time: deixis and directional movement in schoolchildren’s Quechua” in Marilyn Manley and Antje Muntendam, eds., Quechua Expressions of Stance and Deixis. Brill Studies in the Indigenous Languages of the Americas, Leiden.\u003cbr\u003eMUL028R041I001.xml - No description.\u003cbr\u003eMUL028R041I003.mp4 - No description.\u003cbr\u003eMUL028R041I004.mp4 - No description.\u003cbr\u003eMUL028R041I006.pdf - No description.\u003cbr\u003eMUL028R041I002.mp4 - Time Content 0-3:34 Ignacio Quispe (Community Secretary of Ccotatócclla) and Hipólito Peralta Ccama (HPC) discuss and fill out survey on general use of Quechua in the community 3:35-9:38 HPC presents official request for permission to film in community and discusses compensation to community. Ignacio thanks SK for the compensation. HPC rapidly reads the permission form in Spanish; SK asks him to read slower, but Ignacio says he understands. Ignacio then reads the Quechua version aloud (it has been unusual to find adults literate in Quechua in the communities, but this community has been visited by a program called CEPROSI and has learned using the normalized orthography. HPC comments that he feels vindicated that the normalized orthography works, and SK comments that children in the school have also been showing that they can read in Quechua.) Ignacio signs the permission form. HPC suggests that Ignacio should be a language teacher to foreigners who come to learn in the countryside and complete homestays with indigenous families. Ignacio demonstrates his understanding of the normalized Quechua writing system and the sounds of Quechua.","es":"MUL028R041I005.mp4 - Hipólito Peralta Ccama acompaña a Ignacio Quispe Huisa, quién lee en voz alta una carta solicitando autorización para hacer una investigación lingüística; se identifica por nombre y declara que quisiera que solo les hablen en quechua a sus hijas.\u003cbr\u003e41QutaIgnacioCP.pdf - Proceso de creación: Susan Kalt le pidió a Janett Vengoa que elija narraciones “exitosas” basadas en el cuento del pato al final de cada entrevista (véase las últimas dos páginas de MUL028R111 de esta colección.) El criterio para el éxito era que el entrevistador limitó sus intervenciones a preguntas infrecuentes en vez de explicaciones largas y preguntas frecuentes, y que la mayoría del habla fue por parte de la persona entrevistada. Las narraciones “sin éxito” se caracterizaron por silencios largos y una correspondencia casi uno por uno entre el número de preguntas del entrevistador y respuestas por el entrevistado. Vengoa transcribió y tradujo al español esta narración usando un formato CHILDES modificado. Este archivo es un transcrito de una narración “exitosa”, pero no se transcribió a tiempo para ser incluido en el análisis presentado en (2015) \\xa0\\xa0\\xa0Kalt, Susan\\xa0\\xa0\\xa0 “Pointing in space and time: deixis and directional movement in schoolchildren’s Quechua” in Marilyn Manley and Antje Muntendam, eds.,\\xa0Quechua Expressions of Stance and Deixis.\\xa0Brill Studies in the Indigenous Languages of the Americas, Leiden.\u003cbr\u003eMUL028R041I001.xml - Sin descripción.\u003cbr\u003eMUL028R041I003.mp4 - Sin descripción.\u003cbr\u003eMUL028R041I004.mp4 - Sin descripción.\u003cbr\u003eMUL028R041I006.pdf - Sin descripción.\u003cbr\u003eMUL028R041I002.mp4 - Tiempo Contenido 0-3:34 Ignacio Quispe (secretario communal de Ccotatócclla) e Hipólito Peralta Ccama (HPC) conversan y llenan plantilla sobre uso general de quechua en la comunidad. 3:35-9:38 HPC presenta solicitud oficial para videograbar en la comunidad y menciona compensación a la comunidad. Ignacio agradece a SK por la compensación. HPC lee rápidamente la solicitud en castellano; SK le pide leer más lento pero Ignacio dice que comprende. Ignacio luego lee la versión quechua en voz alta (no ha sido común encontrar adultos alfabetos en las comunidades, pero esta comunidad ha tenido visita del programa CEPROSI y se ha alfabetizado por medio de la ortografía normalizada. HPC comenta que se siente vindicado que funcione la ortografía normalizada, y comenta SK que algunos niños en la escuela también han demostrado que saben leer en quechua.) Ignacio firma la solicitud de permiso. HPC le sugiere que enseñe quechua a los extranjeros que vienen a aprender en el campo y que los aloje. Ignacio demuestra su conocimiento del sistema normalizado y los sonidos del quechua.","pt":"MUL028R041I005.mp4 - Hipólito Peralta Ccama senta -se com Ignacio Quispe Huisa, que lê em voz alta uma carta solicitando autorização para conduzir pesquisas, afirma seu nome e diz que gostaria que as pessoas falassem com seus filhos apenas em Quechua.\u003cbr\u003e41QutaIgnacioCP.pdf - Processo de criação: Susan Kalt pediu a Janett Vengoa que selecione narrativas de 'sucesso' com base na história do pato no final de cada entrevista (consulte as últimas duas páginas do Mul028R111 nesta coleção). O critério para o sucesso foi que o entrevistador limitou suas intervenções a instruções pouco frequentes, em vez de explicações longas e perguntas frequentes, e que a pessoa entrevistada fez a maior parte da conversa. Narrativas malsucedidas foram caracterizadas por longos silêncios e uma correspondência quase individual entre o número de perguntas do entrevistador e as respostas filhos. O Vengoa transcreveu e traduziu essa narrativa para o espanhol usando um formato Childes modificado. Este arquivo de mídia é uma transcrição de uma narrativa 'bem -sucedida', mas não foi transcrito a tempo de ser incluído na análise apresentada em (2015) Kalt, Susan “apontando no espaço e no tempo: Deixis e movimento direcional nos quechua de crianças em idade escolar” em Marilyn Manley e Antje Muntendam, orgs., Quechua Expressões de postura e deixis. Estudos Brill nas línguas indígenas das Américas, Leiden.\u003cbr\u003eMUL028R041I001.xml - Sem descrição.\u003cbr\u003eMUL028R041I003.mp4 - Sem descrição.\u003cbr\u003eMUL028R041I004.mp4 - Sem descrição.\u003cbr\u003eMUL028R041I006.pdf - Sem descrição.\u003cbr\u003eMUL028R041I002.mp4 - Conteúdo de tempo 0-3: 34 Ignacio quispe (Secretário da Comunidade de Ccotatóclla) e Hipólito Peralta CCAMA (HPC) Discutir e preencher a pesquisa sobre o uso geral de quíchua na comunidade 3: 35-9: 38 HPC apresenta solicitação oficial de permissão para filmar na comunidade e discute a compensação à comunidade. Ignacio agradece SK pela compensação. O HPC lê rapidamente o formulário de permissão em espanhol; Sk pede que ele leia mais devagar, mas Ignacio diz que entende. Ignacio então lê a versão Quechua em voz alta (foi incomum encontrar adultos alfabetizados em quíchua nas comunidades, mas essa comunidade foi visitada por um programa chamado CeProsi e aprendeu usando a ortografia normalizada. Comentários do HPC que ele se sente forçado a ser normalizado Ortografia funciona, e a SK comenta que as crianças da escola também mostram que podem ler em Quechua.) Ignacio assina o formulário de permissão. O HPC sugere que Ignacio deve ser professor de idiomas para estrangeiros que vêm aprender no campo e concluir casas de família com famílias indígenas. Ignacio demonstra sua compreensão do sistema de escrita de Quechua normalizado e dos sons de Quechua."},"last_updated":"2024-04-10T16:29:28.884951-05:00","user_last_updated":62,"visibility":"LOG","embargo_date":null,"date_created":20090714,"genre":[17,35],"genre_detail":[{"id":17,"name":{"id":71,"en":"Elicitation","es":"Elicitación","pt":"Elicitação"}},{"id":35,"name":{"id":107,"en":"Permissions","es":"Permisos","pt":"Permissões"}}],"collection_item_id":{"id":582,"en":"The Speech of Children from Cusco and Chuquisaca","es":"Habla de los niños de Cusco y Chuquisaca","pt":"O discurso de crianças de Cusco e Chuquisaca"},"folder_item_id":{"id":9396,"en":"Interview with Ignacio Quispe Huisa","es":"Entrevista con Ignacio Quispe Huisa","pt":"Entrevista com Ignacio Quispe Huisa"},"files":[{"id":94010,"legacy_id":"MUL028R041I006","islandora_pid":"ailla:218034","parent_item":9956,"item_file_id":{"id":9956,"en":"Interview with Ignacio Quispe Huisa","es":"Entrevista con Ignacio Quispe Huisa","pt":"Entrevista com Ignacio Quispe Huisa"},"filename":"MUL028R041I006.pdf","media_language":[89],"media_language_detail":[{"id":89,"name":{"id":536,"en":"Quechua, Cuzco","es":"quechua cuzqueño","pt":"quíchua de Cusco"},"language_code":"quz"}],"media_type":"image","source_note":"41.Quta.Ignacio Quispe Huisa","place_created":"Ccotatoclla, Cusco","content_type":1,"content_type_detail":{"id":1,"name":{"id":205,"en":"Annotation","es":"Anotación","pt":"Anotação"}},"original_medium":12,"original_medium_detail":{"id":12,"
