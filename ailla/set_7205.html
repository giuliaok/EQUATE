_name_language":null,"indigenous_description":"","indigenous_description_language":null,"parent_folder":6705,"description":{"id":31064,"en":"016_Craftsman_Juan_Tenesca_makes_and_plays_an_Andean_longhorn,_Part_3.mov - Juan Tenesaca Aguaza demonstrates preparing and playing a traditional bocino (Andean longhorn) that he has made. Filmed by Judy Blankenship. La Capilla, Chorocopte, Cañar.\u003cbr\u003e017_Craftsman_Juan_Tenesaca_makes_small_drum_of_skin_and_wood.mov - Juan Tenesaca Aguaza makes a small drum of cowhide and wood used for Carnival, with family scenes of a son plowing with yoked oxen, and a daughter preparing and cooking a cuy (guinea pig). Filmed by Judy Blankenship. La Capilla, Chorocopte, Cañar.\u003cbr\u003e014_Craftsman_Juan_Tenesca_makes_an_Andean_longhorn,_Part_1.mov - Juan Tenesaca Aguaza selects the materials to make a traditional bocino (Andean longhorn) with cow horns and guadua (giant bamboo). Filmed by Judy Blankenship. La Capilla, Chorocopte, Cañar.\u003cbr\u003e015__Craftsman_Juan_Tenesca_makes_an_Andean_longhorn,_Part_2.mov - Juan Tenesaca Aguaza works with his son to make a traditional bocino (Andean longhorn) with cow horns and guadua (giant bamboo). Filmed by Judy Blankenship. La Capilla, Chorocopte, Cañar, Cañar.\u003cbr\u003e001_Preparing_a_floor_loom_for_weaving.mov - Liberato Buñay at his floor loom outside his house explaining in Kichwa as he plies wool and prepares the warping board. Filmed by Judy Blankenship with interview by José Miguel Acero. Chaglaban, Cañar.\u003cbr\u003e007_Dying_and_washing_hand-woven_wool_clothing.mov - Mercedes Guamán Mayancela and her mother Rosa wash and dye yarn and clothing on wood fire, preparing for Carnival, while uncle harvests grass for animals and children play nearby. Filmed by Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e008_Dying_handspun_wool.mov - Mercedes Guamán Mayancela dyes wool in ceramic pot on fire and talks about her childhood, while she and other family members wash the dyed wool in irrigation canal. Children play and life goes on in the countryside nearby. Quilloac, Cañar.\u003cbr\u003e009_Preparing_clothing_for_carnival_and_demonstrating_weaving.mov - Mercedes Guamán Mayancela works in her patio to wash newly woven wool while Juliana Mayancela Pichisaca sews a special boiled wool cape for Carnival, called a wallacarina. Antonio Guamán Mayancela shows his weavings and demonstrates weaving on his large back-strap loom, while other family members participate in preparing clothing for Carnival. Quilloac, Cañar.\u003cbr\u003e018_Weaver_Juan_Tenesaca_makes_natural_dyes,_Part_1.mov - Master weaver Juan Tenesaca Aguaza demonstrates the plants he uses to make natural dyes and dyes skeins of wool in pots on open fire. Additional scenes include sheep and cows, barley harvest, winnowing and drying barley. La Capilla, Chorocopte, Cañar.\u003cbr\u003e019_Weaver_Juan_Tenesaca_makes_natural_dyes,_Part_2_.mov - Master weaver Juan Tenesaca Aguaza demonstrates the plants, nuts and berries he uses to make natural dyes, and dyes skeins of wool in pots on open fire. Domestic scenes with family. La Capilla, Chorocopte, Cañar.\u003cbr\u003e020_Weaver_Juan_Tenesaea_weaves_ikat_on_backstrap_loom.mov - Master weaver Juan Tenesaca Aguaza weaves an ikat shawl on his backstrap loom. Domestic scenes with wife and daughter. La Capilla, Chorocopte, Cañar.","es":"016_Craftsman_Juan_Tenesca_makes_and_plays_an_Andean_longhorn,_Part_3.mov - Juan Tenesaca Aguaza prepara y toca un bocino tradicional que él ha elaborado. Grabado por Judy Blankenship. La Capilla, Chorocopte, Cañar.\u003cbr\u003e017_Craftsman_Juan_Tenesaca_makes_small_drum_of_skin_and_wood.mov - Juan Tenesaca Aguaza elabora un pequeño tambor de piel de vaca y madera que se usa para el Carnaval, con escenas familiares de un hijo arando con bueyes yugos y una hija preparando y cocinando un cuy. Grabado por Judy Blankenship. La Capilla, Chorocopte, Cañar.\u003cbr\u003e014_Craftsman_Juan_Tenesca_makes_an_Andean_longhorn,_Part_1.mov - Juan Tenesaca Aguaza escoge los materiales para hacer un bocino tradicional (trompa andina) con cuernos de ganado y guadua (bambú gigante). Grabado por Judy Blankenship. La Capilla, Chorocopte, Cañar.\u003cbr\u003e015__Craftsman_Juan_Tenesca_makes_an_Andean_longhorn,_Part_2.mov - Juan Tenesaca Aguaza trabaja con su hijo para elabora un bocino tradicional con cuernos de vaca y guadua. Grabado por Judy Blankenship. La Capilla, Chorocopte, Cañar.\u003cbr\u003e001_Preparing_a_floor_loom_for_weaving.mov - Liberato Buñay prepara un telar de piso al lado de su casa con una explicación en kichwa mientras teje lana y prepara la tabla de urdimbre. Grabado por Judy Blankenship con entrevista por José Miguel Acero. Chaglaban, Cañar.\u003cbr\u003e007_Dying_and_washing_hand-woven_wool_clothing.mov - Mercedes Guamán y su madre Rosa lavan y tiñen hilo y ropa en fuego de leña, preparándose para el Carnaval, mientras el tío cosecha pasto para los animales y los niños juegan. Grabado por Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e008_Dying_handspun_wool.mov - Mercedes Guamán Mayancela tiñe lana en una olla al fuego y cuenta su infancia, mientras ella y otros familiares lavan lana en un canal de riego. Los niños juegan y la vida continúa en el campo cercano. Quilloac, Cañar.\u003cbr\u003e009_Preparing_clothing_for_carnival_and_demonstrating_weaving.mov - Mercedes Guamán Mayancela trabaja en su patio lavando lana recién tejida mientras Juliana Mayancela Pichisaca cose una capa especial de lana hervida llamada wallacarina para el Carnaval. Antonio Guamán Mayancela muestra sus tejidos y demuestra cómo teje en su gran telar de espalda, mientras otros miembros de la familia participan en la preparación de la ropa para el Carnaval. Quilloac, Cañar.\u003cbr\u003e018_Weaver_Juan_Tenesaca_makes_natural_dyes,_Part_1.mov - El maestro tejedor Juan Tenesaca Aguaza demuestra las plantas que usa para hacer tintes naturales y tiñe ovillos de lana en macetas a fuego abierto. Las escenas adicionales incluyen ovejas y vacas, cosecha de cebada, aventar y secar cebada. La Capilla, Chorocopte, Cañar.\u003cbr\u003e019_Weaver_Juan_Tenesaca_makes_natural_dyes,_Part_2_.mov - El maestro tejedor Juan Tenesaca Aguaza hace una demostración de las plantas, frutos secos y bayas que utiliza para hacer tintes naturales y tiñe madejas de lana en macetas a fuego abierto. Escenas domésticas con familia. La Capilla, Chorocopte, Cañar.\u003cbr\u003e020_Weaver_Juan_Tenesaea_weaves_ikat_on_backstrap_loom.mov - El maestro tejedor Juan Tenesaca Aguaza teje un chal ikat en su telar de cintura. Escenas domésticas con esposa e hija. La Capilla, Chorocopte, Cañar.","pt":"016_Craftsman_Juan_Tenesca_makes_and_plays_an_Andean_longhorn,_Part_3.mov - Juan Tenesaca Aguaza demonstra preparar e interpretar um bocino tradicional (Andean Longhorn) que ele fez. Filmado por Judy Blankenship. La Capilla, Chorocopte, Cañar.\u003cbr\u003e017_Craftsman_Juan_Tenesaca_makes_small_drum_of_skin_and_wood.mov - Juan Tenesaca Aguaza faz um pequeno tambor de couro e madeira usado para o carnaval, com cenas familiares de um filho arando de bois unidos e uma filha preparando e cozinhando um Cuy (cobaias). Filmado por Judy Blankenship. La Capilla, Chorocopte, Cañar.\u003cbr\u003e014_Craftsman_Juan_Tenesca_makes_an_Andean_longhorn,_Part_1.mov - Juan Tenesaca Aguaza seleciona os materiais para fazer um bocino tradicional (Andean Longhorn) com chifres de vaca e Guadua (bambu gigante). Filmado por Judy Blankenship. La Capilla, Chorocopte, Cañar.\u003cbr\u003e015__Craftsman_Juan_Tenesca_makes_an_Andean_longhorn,_Part_2.mov - Juan Tenesaca Aguaza trabalha com seu filho para fazer um bocino tradicional (Andean Longhorn) com chifres de vaca e Guadua (bambu gigante). Filmado por Judy Blankenship. La Capilla, Chorocopte, Cañar, Cañar.\u003cbr\u003e001_Preparing_a_floor_loom_for_weaving.mov - Liberato Buñay em seu chão aparece do lado de fora de sua casa, explicando em Kichwa enquanto ele coloca lã e prepara a tábua de deformação. Filmado por Judy Blankenship com a entrevista de José Miguel Acero. Chaglaban, Cañar.\u003cbr\u003e007_Dying_and_washing_hand-woven_wool_clothing.mov - Mercedes Guamán Mayancela e sua mãe Rosa Wash e Ting, fios e roupas em madeira, preparando -se para o carnaval, enquanto o tio colhe grama para animais e crianças brincam nas proximidades. Filmado por Judy Blankenship. Quilloac, Cañar.\u003cbr\u003e008_Dying_handspun_wool.mov - Mercedes Guamán Mayancela Tinge Wool in Ceramic Pot On Fire e fala sobre sua infância, enquanto ela e outros membros da família lavam a lã tingida no canal de irrigação. As crianças brincam e a vida continua no campo nas proximidades. Quilloac, Cañar.\u003cbr\u003e009_Preparing_clothing_for_carnival_and_demonstrating_weaving.mov - Mercedes Guamán Mayancela trabalha em seu pátio para lavar a lã recém -tecida, enquanto Juliana Mayancela Pichisaca costura uma capa de lã cozida especial para carnaval, chamada Wallacarina. Antonio Guamán Mayancela mostra suas tecelagens e demonstra tecelagem em seu grande tear de alça traseira, enquanto outros membros da família participam da preparação de roupas para o carnaval. Quilloac, Cañar.\u003cbr\u003e018_Weaver_Juan_Tenesaca_makes_natural_dyes,_Part_1.mov - O mestre tecelão Juan Tenesaca Aguaza demonstra as plantas que ele usa para fazer corantes e corantes naturais de lã em vasos em fogo aberto. Cenas adicionais incluem ovelhas e vacas, colheita de cevada, WinNowing e secagem de cevada. La Capilla, Chorocopte, Cañar.\u003cbr\u003e019_Weaver_Juan_Tenesaca_makes_natural_dyes,_Part_2_.mov - O mestre tecelão Juan Tenesaca Aguaza demonstra as plantas, nozes e bagas que ele usa para fazer corantes naturais e corantes de lã em vasos em fogo aberto. Cenas domésticas com família. La Capilla, Chorocopte, Cañar.\u003cbr\u003e020_Weaver_Juan_Tenesaea_weaves_ikat_on_backstrap_loom.mov - O mestre tecelão Juan Tenesaca Aguaza tece um xale ikat em seu tear de costas. Cenas domésticas com esposa e filha. La Capilla, Chorocopte, Cañar."},"last_updated":"2024-04-19T12:52:29.664737-05:00","user_last_updated":62,"visibility":"LOG","embargo_date":null,"date_created":20000000,"genre":[18],"genre_detail":[{"id":18,"name":{"id":73,"en":"Ethnography","es":"Etnografía","pt":"Etnografia"}}],"collection_item_id":{"id":722,"en":"Cañar Collection of Judy Blankenship","es":"Colección de Cañar de Judy Blankenship","pt":"Coleção Cañar de Judy Blankenship"},"folder_item_id":{"id":6705,"en":"Videos - Cañari Traditional Handicrafts","es":"Videos - Artesanías tradicionales cañaries","pt":"Vídeos - Cañari Tradicional Handicrafts"},"files":[{"id":78344,"legacy_id":"","islandora_pid":"ailla:279643","parent_item":7205,"item_file_id":{"id":7205,"en":"Videos - Cañari Traditional Handicrafts","es":"Videos - Artesanías tradicionales cañaries","pt":"Vídeos - Cañari Tradicional Handicrafts"},"filename":"007_Dying_and_washing_hand-woven_wool_clothing.mov","media_language":[232,9],"media_language_detail":[{"id":232,"name":{"id":822,"en":"Kichwa, Cañar Highland","es":"quichua de alto Cañar","pt":"quichua da alta Canhar"},"language_code":"qxr"},{"id":9,"name":{"id":376,"en":"Spanish","es":"español","pt":"espanhol"},"language_code":"spa"}],"media_type":"video","source_note":"","place_created":"Cañar, Ecuador","content_type":9,"content_type_detail":{"id":9,"name":{"id":221,"en":"Primary text","es":"Texto primario","pt":"Texto Principal"}},"original_medium":25,"original_medium_detail":{"id":25,"name":{"id":279,"en":"video:digital","es":"video:digital","pt":"vídeo:digital"}},"tape_label":"","date_uploaded":"2021-04-21T00:00:00-05:00","date_modified":"2024-03-04T00:00:00-06:00","date_archived":null,"date_created":20000000,"file_size":482794,"height":468,"width":640,"extent":"0:40:22","rights_statements":[10,11],"rights_statements_detail":[{"id":10,"title":{"id":19,"en":"In Copyright - Educational Use Permitted","es":"Protegido por Derecho de Autor - Uso Educativo Permitido","pt":"Protegido pelo D
