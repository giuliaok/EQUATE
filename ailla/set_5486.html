tion_language":null,"parent_folder":5006,"description":{"id":24373,"en":"ailla_hmk_box3of5.pdf - Ngäbere fileslips. On computer. File in word list. D. Q. H. K. M. N. Ñ. Ŋ. R. S. T. W. I. Ɔ. U. Ö. Ü. Locational. Sentences with pronouns. On computer. Sentences with problems of transcription or elicitation not on computer. Bibliographic notes. Mailing addresses.\u003cbr\u003eHK-G-01.pdf - Short stack of 3x5 inch fileslips of Ngäbere adpositions. First card lists prepositions. Following cards give Ngäbere form and Spanish gloss of postpositions. Small inserted slip of paper (between aye' dreboto and abo' kon kore) introduces \"doubtful postpositions\".\u003cbr\u003eHK-G-03.pdf - Short stack of 3x5 inch fileslips of Ngäbere auxilliaries.\u003cbr\u003eHK-G-04.pdf - Short stack of 4x6 inch fileslips of Ngäbere verb roots. Note that some roots are borrowed Spanish terms (e.g. studia- \u003cestudiar, canta- \u003c cantar).\u003cbr\u003eHK-G-02.pdf - Three 3x5 inch fileslips of Ngäbere verb suffixes.","es":"ailla_hmk_box3of5.pdf - Fichas lingüísticas del ngäbere. En la computadora. Archivar en lista de palabras. D. Q. H. K. M. N. Ñ. Ŋ. R. S. T. W. I. Ɔ. U. Ö. Ü. Locacional. Frases con pronombres. Frases con problemas de transcripción o elicitación que no están en la computadora. Notas bibliográficas. Direcciones.\u003cbr\u003eHK-G-01.pdf - Un conunto de fichas de 3x5 pulgadas sobre adposiciones de ngäbere. La primera ficha es una lista de preposiciones. Las siguientes fichas dan la forma ngäbere y la desglosa en castellano de las posposiciones. Una pequeña hoja suelta (entre aye' dreboto y abo' kon kore) inicia las \"posposiciones dudosas\".\u003cbr\u003eHK-G-03.pdf - Un conjunto de fichas de 3x5 pulgadas de verbos auxiliares de ngäbere.\u003cbr\u003eHK-G-04.pdf - Un conjunto de fichas de 4x6 pulgadas de raíces verbales en ngäbere. Nótese que algunas raíces son préstamos castellanos (e.g. studia- \u003cestudiar, canta- \u003c cantar).\u003cbr\u003eHK-G-02.pdf - Tres fichas de 3x5 pulgadas de sufijos verbales de ngäbere.","pt":"ailla_hmk_box3of5.pdf - NGäBere LIPS LIPS. No computador. Arquivo na lista de palavras. D. Q. H. K. M. N. ñ. Ŋ. R. S. T. W. I. ɔ. U. Ö. VOCÊ. Locacional. Frases com pronomes. No computador. Frases com problemas de transcrição ou elicitação não no computador. Notas bibliográficas. Endereços de correspondência.\u003cbr\u003eHK-G-01.pdf - Pilha curta de lips de arquivos de 3x5 polegadas de adposições ngäbere. Primeiro cartão lista as preposições. A seguir, os cartões dão a forma ngäbere e o brilho espanhol de posições. Pequeno deslizamento de papel inserido (entre os Aye 'Dreboto e ABO ' Kon Kore) introduz\" Postpositionios duvidosos \" . \"\u003cbr\u003eHK-G-03.pdf - Pilha curta de lips de arquivos de 3x5 polegadas de auxiliários ngäbere.\u003cbr\u003eHK-G-04.pdf - Pilha curta de lips de arquivos de 4x6 polegadas das raízes verbais ngäbere. Observe que algumas raízes são emprestados termos espanhóis (por exemplo, Studia- \u003cEstudiar, Canta- \u003cCantar).\u003cbr\u003eHK-G-02.pdf - Três lips de arquivos de 3x5 polegadas dos sufixos de verbos ngäbere."},"last_updated":"2024-04-12T13:36:13.760153-05:00","user_last_updated":62,"visibility":"LOG","embargo_date":null,"date_created":10000101,"genre":[19],"genre_detail":[{"id":19,"name":{"id":75,"en":"Field notes","es":"Notas de campo","pt":"Notas de Campo"}}],"collection_item_id":{"id":604,"en":"Ngäbere Collection of Harriet Manelis Klein","es":"Colección del Ngäbere de Harriet Manelis Klein","pt":"Coleção Ngäbere de Harriet Manelis Klein"},"folder_item_id":{"id":5006,"en":"Ngäbere Fileslips","es":"Fichas de ngäbere","pt":"Ficheiros ngäbere "},"files":[{"id":70791,"legacy_id":"","islandora_pid":"ailla:285637","parent_item":5486,"item_file_id":{"id":5486,"en":"Ngäbere Fileslips","es":"Fichas de ngäbere","pt":"Ficheiros ngäbere "},"filename":"HK-G-01.pdf","media_language":[8,9,47],"media_language_detail":[{"id":8,"name":{"id":374,"en":"English","es":"inglés","pt":"inglês
