},"language_code":"cuk"},"indigenous_description":"","indigenous_description_language":null,"parent_folder":4997,"description":{"id":24335,"en":"20170212_3.wav - Discussion between Joel Sherzer and Jain Orr of how we will conduct the project of archiving these images. Additionally, more discussion regarding how Joel saw Kuna residents of Mulatuppu make hammocks during his fieldwork in the 1970s.\u003cbr\u003e20170212_1.wav - Discussion between Joel Sherzer and Jain Orr about the Kuna art of basket-making.\u003cbr\u003e20170212_2.wav - Discussion between Joel Sherzer and Jain Orr regarding how Joel saw Kuna residents of Mulatuppu make hammocks during his fieldwork in the 1970s.\u003cbr\u003e20170421.wav - Discussion between Joel Sherzer and Jain Orr about how Joel lived during his time studying the Kuna language in Mulatuppu during the 1970s. This includes details about his daily routine, balancing scholarly work, domestic work, and leisure time.\u003cbr\u003e20170423.wav - Discussion between Joel Sherzer and Jain Orr about how Joel lived during his time studying the Kuna language in Mulatuppu during the 1970s. This includes details about his daily routine, balancing scholarly work, domestic work, and leisure time.\u003cbr\u003e20170212_4.wav - Discussion between Joel Sherzer and Jain Orr about men making a colander of gourd and wood. The men carve the holes in the gourd in a decorative pattern. The women use the gourds for cooking and laundry. Examples of these images can be found in the resource \"home\".\u003cbr\u003e20170508_1.wav - Discussion between Joel Sherzer and Jain Orr about the process of getting photographs in Mulatuppu during the 1970s. We are discussing photographs that are not included in the collection.\u003cbr\u003e20170409.wav - Discussion between Joel Sherzer and Jain Orr about the resource entitled \"Home\" - including descriptions about the layout of a typical Kuna homestead and how people performed basic household chores such as laundry, dishes, and cooking.\u003cbr\u003e20170312.wav - Discussion between Joel Sherzer and Jain Orr about the resource entitled \"Portraits\" - including identification of some individuals, descriptions about how the photographs came to exist, and what Sherzer noticed about the way Kuna people interact with photos differently than American people.\u003cbr\u003e20170508_2.wav - Discussion between Joel Sherzer and Jain Orr about the resources \"Community\" and \"Home\". The Community resource takes up most of the discussion and includes topics ranging from dance troupes to economy.\u003cbr\u003e20170501.wav - Discussion between Joel Sherzer and Jain Orr about the resources \"Ecology\", \"Portside\", and \"Community\".\u003cbr\u003e20170404.wav - We discuss camera angles, especially three photographs of the same two women working on molas taken from multiple angles as Sherzer adjusts to the lighting. We also discussed the Kuna’s collective property law regarding specific protections for the process of making molas. Orr expresses that the photographs containing close-up images of the mola-making process should have increased access restrictions.\u003cbr\u003e20170128_1.wav - Joel Sherzer and Jain Orr discuss hammock making in Mulatuppu. These photographs can be found in the resource entitled \"home\".\u003cbr\u003e20170414.wav - Joel Sherzer and Jain Orr discuss the somewhat violent language of photography such as: “point and shoot”, “capture”, “take a picture”. Sherzer also discusses his thoughts on visual anthropology. Jain discusses plans to present this project at the Tribal Librarian Conference in Boezman, MT and the American Anthropological Association conference in DC in 2017. She speaks about how the presentation might be different, which led to a discussion of salvage paradigm’s influence on data collection and preservation. Sherzer and Orr also breifly discuss the Kuna's proximity to the canal zone and Kuna notoriety, which Sherzer attributes to the fact that the Kuna are well organized, they stand out, and are very outgoing. The audio quality is rather poor in places as there is a lot of background noise.\u003cbr\u003e20170219.wav - Joel Sherzer and Jain Orr discuss Sherzer's views on the differences between a song and a chant. Orr remarks that on AILLA, there seem to be a high representation of lullabies. This leads to a discussion of confirmation bias in data collection. Sherzer and Orr enlist the help of Dina Sherzer to help identify birds on the molas. She explains that molas depictions of animals are highly stylized. Joel Sherzer relates body painting to molas, explaining that some researchers believe that in Kuna culture, body painting morphed into mola designs. Dina Sherzer describes the journey to and from Mulatuppu as a way to convey how she got artifacts (specifically molas) back home. She also explains that the cultures inhabiting the areas around Kuna Yala have a tradition of being often engaged in warfare.\u003cbr\u003e20170307.wav - Joel Sherzer and Jain Orr discuss how photography functioned as a way to begin social interactions while he was a stranger walking around Mulatuppu. They discuss how the high proportion of portraits imply informal consent. Mostly, they discuss a lot of \"housekeeping\" items related to building a collection to AILLA specifications.\u003cbr\u003e20170128_2.wav - Joel Sherzer and Jain Orr discuss how Sherzer approached photography while in Mulatuppu. He says that for many people, taking photographs is a way to show the people back home what you did. For him, he tried to make it a more scholarly approach. Sherzer also discusses the possibility of exhibiting the photographs on the 2nd floor of the Benson Library.\u003cbr\u003e20170402.wav - Joel Sherzer and Jain Orr discuss photographs from the resources “Community” and “Home”. Specifically, Sherzer discusses how he sees much of the Kuna aesthetic revolves around \"coming together\" - including the way that medicinal specialists do their work - with chanting to the sticks that are carved like people. Various chants have a medicinal effect and are grouped together. Sherzer and Orr also discuss photographs of dancing.\u003cbr\u003e20170226.wav - Joel Sherzer and Jain Orr discuss transcriptions created by Orr of an earlier session. Sherzer's medication has made him rather drowsy. They review discussions of basket-making and hammock-making - which can be found in the resources entitled \"Gathering house\" and \"Home\". Both still discuss how to organized the photographs within resources in AILLA in a way that is logical.","es":"20170212_3.wav - Discusión entre Joel Sherzer y Jain Orr de cómo llevaremos a cabo el proyecto de archivo de estas imágenes. Además, más discusión sobre cómo Joel vio a residentes de Kuna de Mulatuppu hacer hamacas durante su trabajo de campo en los años 70.\u003cbr\u003e20170212_1.wav - Discusión entre Joel Sherzer y Jain Orr sobre el arte de hacer cestas en Mulatuppu.\u003cbr\u003e20170212_2.wav - Discusión entre Joel Sherzer y Jain Orr sobre cómo Joel vio a residentes de Kuna de Mulatuppu hacer hamacas durante su trabajo de campo en los años 70.\u003cbr\u003e20170421.wav - Discusión entre Joel Sherzer y Jain Orr sobre cómo Joel vivió durante su tiempo que estudiaba la lengua de Kuna en Mulatuppu durante los años 70. Esto incluye detalles sobre su rutina diaria, equilibrando el trabajo académico, el trabajo doméstico y el tiempo de ocio.\u003cbr\u003e20170423.wav - Discusión entre Joel Sherzer y Jain Orr sobre cómo Joel vivió durante su tiempo que estudiaba la lengua de Kuna en Mulatuppu durante los años 70. Esto incluye detalles sobre su rutina diaria, equilibrando el trabajo académico, el trabajo doméstico y el tiempo de ocio.\u003cbr\u003e20170212_4.wav - Discusión entre Joel Sherzer y Jain Orr sobre hombres que hacen un colador de calabaza y madera. Los hombres tallan los agujeros en la calabaza en un patrón decorativo. Las mujeres usan las calabazas para cocinar y lavar ropa. Ejemplos de estas imágenes se pueden encontrar en el recurso \"home\".\u003cbr\u003e20170508_1.wav - Discusión entre Joel Sherzer y Jain Orr sobre el proceso de obtener fotografías en Mulatuppu durante los años setenta. Estamos discutiendo fotografías que no están incluidas en la colección.\u003cbr\u003e20170409.wav - Discusión entre Joel Sherzer y Jain Orr sobre el recurso titulado \"Hogar\" - incluyendo descripciones sobre el diseño de una granja típica de Kuna y cómo la gente realizaba tareas domésticas básicas tales como lavandería, platos y cocina.\u003cbr\u003e20170312.wav - Discusión entre Joel Sherzer y Jain Orr sobre el recurso titulado \"Retratos\" - incluyendo la identificación de algunos individuos, descripciones sobre cómo las fotografías llegaron a existir, y lo que Sherzer notó sobre la forma en que las personas Kuna interactuar con las fotos de manera diferente que la gente estadounidense.\u003cbr\u003e20170508_2.wav - Discusión entre Joel Sherzer y Jain Orr sobre los recursos \"Comunidad\" y \"Hogar\". El recurso de la comunidad ocupa la mayor parte de la discusión e incluye los temas que se extienden de las compañías de la danza a la economía.\u003cbr\u003e20170501.wav - Discusión entre Joel Sherzer y Jain Orr sobre los recursos \"Ecología\", \"Portside\" y \"Comunidad\".\u003cbr\u003e20170404.wav - Joel Sherzer y Jain Orr discuten las fotografías contenidas en los recursos \"Comunidad\" y \"Mola-making\". También discutimos ángulos de cámara, especialmente tres fotografías de las mismas dos mujeres que trabajan en molas tomadas de ángulos múltiples como Sherzer se ajusta a la iluminación. También discutimos la ley de propiedad colectiva de Kuna con respecto a protecciones específicas para el proceso de fabricación de molas. Orr expresa que las fotografías que contienen imágenes en primer plano del proceso de fabricación de mola deben tener mayores restricciones de acceso.\u003cbr\u003e20170128_1.wav - Joel Sherzer y Jain Orr hablan sobre la fabricación de hamacas en Mulatuppu. Estas fotografías se pueden encontrar en el recurso titulado \"hogar\".\"\u003cbr\u003e20170414.wav - Joel Sherzer y Jain Orr discuten el lenguaje algo violento de la fotografía como: \"apuntar y disparar\", \"capturar\", \"tomar una foto\". Sherzer también discute sus pensamientos sobre la antropología visual. Jain analiza los planes para presentar este proyecto en la Tribal Librarian Conference en Boezman, MT y en la conferencia de la American Anthropological Association en DC en 2017. Habla sobre cómo la presentación podría ser diferente, lo que llevó a una discusión de la influencia del paradigma salvage en la recolección de datos y preservación. Sherzer y Orr también discuten sobre la proximidad del Kuna con la zona del canal y la notoriedad Kuna, que Sherzer atribuye al hecho de que los Kuna están bien organizados, se destacan y son muy extrovertidos. La calidad de audio es bastante pobre en lugares ya que hay mucho ruido de fondo.\u003cbr\u003e20170219.wav - Joel Sherzer y Jain Orr discuten las opiniones de Sherzer sobre las diferencias entre una canción y un canto. Orr observa que en AILLA, parece haber una alta representación de las canciones de cuna. Esto conduce a una discusión del sesgo de la confirmación en la colección de datos. Sherzer y Orr reclutan la ayuda de Dina Sherzer para ayudar a identificar las aves en las molas. Ella explica que las representaciones de los molas de animales son altamente estilizadas. Joel Sherzer relata la pintura corporal a molas, explicando que algunos investigadores creen que en la cultura kuna, la pintura corporal se transformó en diseños de mola. Dina Sherzer describe el viaje hacia y desde Mulatuppu como una manera de transmitir cómo consiguió artefactos (específicamente molas) en casa. También explica que las culturas que habitan las áreas alrededor de Kuna Yala tienen una tradición de estar a menudo involucrados en la guerra.\u003cbr\u003e20170307.wav - Joel Sherzer y Jain Orr discuten cómo la fotografía funcionó como una forma de comenzar las interacciones sociales mientras era un extraño caminando por Mulatuppu. Discutieron cómo la alta proporción de retratos implica consentimiento informal. Sobre todo, discuten una gran cantidad de \"limpieza\" artículos relacionados con la construcción de una colección de AILLA especificaciones.\u003cbr\u003e20170128_2.wav - Joel Sherzer y Jain Orr comentan cómo Sherzer se acercó a la fotografía mientras estaba en Mulatuppu. Él dice que para muchas personas, tomar fotografías es una manera de mostrar a la gente de vuelta a casa lo que hiciste. Para él, trató de hacer un acercamiento más académico. Sherzer también discute la posibilidad de exhibir las fotografías en el 2do piso de la biblioteca de Benson.\u003cbr\u003e20170402.wav - Joel Sherzer y Jain Orr discuten fotografías de los recursos \"Comunidad\" y \"Hogar\". Específicamente, Sherzer discute cómo ve gran parte de la estética Kuna gira en torno a \"unirse\" - incluyendo la forma en que los especialistas médicos hacen su trabajo - con cantar a los palos que se tallan como personas. Varios cantos tienen un efecto medicinal y se agrupan. Sherzer y Orr también discuten fotografías de baile.\u003cbr\u003e20170226.wav - Joel Sherzer y Jain Orr discuten las transcripciones creadas por Orr de una sesión anterior. La medicación de Sherzer lo ha hecho bastante somnoliento. Repasan las discusiones sobre canastas y hamacas - que se pueden encontrar en los recursos titulados \"Casa de encuentro\" y \"Hogar\". Ambos todavía discutir cómo organizar las fotografías dentro de los recursos en AILLA de una manera que es lógico.","pt":"20170212_3.wav - Discussão entre Joel Sherzer e Jain Orr de como conduziremos o projeto de arquivar essas imagens. Além disso, mais discussões sobre como Joel viu os moradores de Kuna de Mulatuppu fazer redes durante seu trabalho de campo na década de 1970.\u003cbr\u003e20170212_1.wav - Discussão entre Joel Sherzer e Jain Orr sobre a arte de Kuna da cesta.\u003cbr\u003e20170212_2.wav - Discussão entre Joel Sherzer e Jain Orr sobre como Joel viu os moradores de Kuna de Mulatuppu fazer redes durante seu trabalho de campo na década de 1970.\u003cbr\u003e20170421.wav - Discussão entre Joel Sherzer e Jain Orr sobre como Joel viveu durante seu tempo estudando a língua Kuna em Mulatuppu durante a década de 1970. Isso inclui detalhes sobre sua rotina diária, equilíbrio de trabalho acadêmico, trabalho doméstico e tempo de lazer.\u003cbr\u003e20170423.wav - Discussão entre Joel Sherzer e Jain Orr sobre como Joel viveu durante seu tempo estudando a língua Kuna em Mulatuppu durante a década de 1970. Isso inclui detalhes sobre sua rotina diária, equilíbrio de trabalho acadêmico, trabalho doméstico e tempo de lazer.\u003cbr\u003e20170212_4.wav - Discussão entre Joel Sherzer e Jain Orr sobre homens fazendo um peneirador de cabaça e madeira. Os homens esculpem os buracos na cabaça em um padrão decorativo. As mulheres usam as cabaças para cozinhar e lavanderia. Exemplos dessas imagens podem ser encontrados no Recurso \"Home\".\u003cbr\u003e20170508_1.wav - Discussão entre Joel Sherzer e Jain Orr sobre o processo de tirar fotografias em Mulatuppu durante a década de 1970. Estamos discutindo fotografias que não estão incluídas na coleção.\u003cbr\u003e20170409.wav - Discussão entre Joel Sherzer e Jain Orr sobre o recurso intitulado\" Home \" - incluindo descrições sobre o layout de uma propriedade típica de Kuna e como as pessoas realizavam tarefas domésticas básicas como roupas, pratos e culinária.\u003cbr\u003e20170312.wav - Discussão entre Joel Sherzer e Jain Orr sobre o recurso intitulado\" Retratos \" - incluindo a identificação de alguns indivíduos, descrições sobre como as fotografias surgiram e o que Sherzer notou sobre como as pessoas de Kuna interagem com as fotos de maneira diferente do povo americano.\u003cbr\u003e20170508_2.wav - Discussão entre Joel Sherzer e Jain Orr sobre os recursos\" Comunidade \"e\" Home \". O recurso comunitário ocupa a maior parte da discussão e inclui tópicos que variam de trupes de dança à economia.\u003cbr\u003e20170501.wav - Discussão entre Joel Sherzer e Jain Orr sobre os recursos\" Ecologia \",\" Portside \"e\" Community \".\u003cbr\u003e20170404.wav - Discutimos os ângulos da câmera, especialmente três fotografias das mesmas duas mulheres que trabalham em molas tiradas de vários ângulos à medida que Sherzer se ajusta à iluminação. Também discutimos a lei de propriedade coletiva da Kuna sobre proteções específicas para o processo de fabricação de molas. Orr expressa que as fotografias que contêm imagens close-up do processo de fabricação de mola devem ter aumentado as restrições de acesso.\u003cbr\u003e20170128_1.wav - Joel Sherzer e Jain Orr discutem a fabricação de redes em Mulatuppu. Essas fotografias podem ser encontradas no recurso intitulado\" Home \".\u003cbr\u003e20170414.wav - Joel Sherzer e Jain Orr discutem a linguagem um tanto violenta da fotografia como: \"Point and Shoot\", \"Capture\", \"Tire uma foto\". Sherzer também discute seus pensamentos sobre a antropologia visual. Jain discute os planos de apresentar este projeto na Conferência Tribal da Bibliotecária em Boezman, MT e na American Anthropological Association Conference em DC em 2017. Ela fala sobre como a apresentação pode ser diferente, o que levou a uma discussão sobre a influência do paradigma de salvamento na coleta de dados e preservação. Sherzer e Orr também discutem Breifly a proximidade da Kuna com a zona do canal e a notoriedade de Kuna, que Sherzer atribui ao fato de que os Kuna estão bem organizados, eles se destacam e são muito extrovertidos. A qualidade do áudio é bastante ruim em alguns lugares, pois há muito ruído de fundo.\u003cbr\u003e20170219.wav - Joel Sherzer e Jain Orr discutem as opiniões de Sherzer sobre as diferenças entre uma música e um canto. Orr observa que em Ailla, parece haver uma alta representação de canções de ninar. Isso leva a uma discussão sobre o viés de confirmação na coleta de dados. Sherzer e Orr recrutam a ajuda de Dina Sherzer para ajudar a identificar pássaros nas molas. Ela explica que as representações de animais de animais são altamente estilizadas. Joel Sherzer relaciona a pintura corporal a Molas, explicando que alguns pesquisadores acreditam que na cultura de Kuna, a pintura corporal se transformou em desenhos de mola. Dina Sherzer descreve a jornada de e para Mulatuppu como uma maneira de transmitir como ela conseguiu artefatos (especificamente molas) de volta para casa. Ela também explica que as culturas que habitam as áreas ao redor de Kuna Yala têm uma tradição de serem frequentemente envolvidas na guerra.\u003cbr\u003e20170307.wav - Joel Sherzer e Jain Orr discutem como a fotografia funcionava como uma maneira de iniciar as interações sociais enquanto ele era um estranho andando por Mulatuppu. Eles discutem como a alta proporção de retratos implicam consentimento informal. Principalmente, eles discutem muitas\" limpeza \"itens relacionados Para construir uma coleção para as especificações de AILLA.\u003cbr\u003e20170128_2.wav - Joel Sherzer e Jain Orr discutem como Sherzer abordou a fotografia enquanto em Mulatuppu. Ele diz que, para muitas pessoas, tirar fotografias é uma maneira de mostrar às pessoas em casa o que você fez. Para ele, ele tentou torná -lo uma abordagem mais acadêmica. Sherzer também discute a possibilidade de exibir as fotografias no 2º andar da biblioteca Benson.\u003cbr\u003e20170402.wav - Joel Sherzer e Jain Orr discutem fotografias da\" Comunidade \"e\" Home \". Especificamente, Sherzer discute como ele vê grande parte da estética de Kuna gira em torno de\" se unir \" - incluindo a maneira como os especialistas medicinais fazem seu trabalho - com cantar para as varas que são esculpidas como pessoas. Vários cânticos têm um efeito medicinal e são agrupados. Sherzer e Orr também desuctam fotografias de dança.\u003cbr\u003e20170226.wav - Joel Sherzer e Jain Orr discutem transcrições criadas por Orr de uma sessão anterior. A medicação de Sherzer o deixou bastante sonolento. Eles revisam discussões sobre a fabricação de cestas e a fabricação de redes-que podem ser encontradas nos recursos intitulados\" Gathering House \"E\" Home \". Ambos ainda discutem como organizar as fotografias dentro dos recursos em Ailla de uma maneira que é lógica."},"last_updated":"2024-04-12T13:17:57.636579-05:00","user_last_updated":62,"visibility":"LOG","embargo_date":null,"date_created":20170128,"genre":[7,12,17,28,35],"genre_detail":[{"id":7,"name":{"id":51,"en":"Conversation","es":"Conversación","pt":"Conversa"}},{"id":12,"name":{"id":61,"en":"Description","es":"Descripción","pt":"Descrição"}},{"id":17,"name":{"id":71,"en":"Elicitation","es":"Elicitación","pt":"Elicitação"}},{"id":28,"name":{"id":93,"en":"Interview","es":"Entrevista","pt":"Entrevista"}},{"id":35,"name":{"id":107,"en":"Permissions","es":"Permisos","pt":"Permissões"}}],"collection_item_id":{"id":603,"en":"Kuna Photograph Collection of Joel Sherzer","es":"Colección Fotográfica Kuna del Joel Sherzer","pt":"Coleção de fotografias de Kuna de Joel Sherzer"},"folder_item_id":{"id":4997,"en":"Audio","es":"Audio","pt":"Audio"},"files":[{"id":70543,"legacy_id":"","islandora_pid":"ailla:247479","parent_item":5477,"item_file_id":{"id":5477,"en":"Audio","es":"Audio","pt":"Audio"},"filename":"20170409.wav","media_language":[8],"media_language_detail":[{"id":8,"name":{"id":374,"en":"English","es":"inglés","pt":"inglês"},"language_code":"eng"}],"media_type":"audio","source_note":"","place_created":"Sherzer's Home, Austin, Texas, United States","content_type":9,"content_type_detail":{"id":9,"name":{"id":221,"en":"Primary text","es":"Texto primario","pt":"Texto Principal"}},"original_medium":3,"original_medium_detail":{"id":3,"name":{"id":235,"en":"audio:digital","es":"audio:digital","pt":"áudio:digital"}},"tape_label":"","date_uploaded":"2017-05-12T00:00:00-05:00","date_modified":"2024-
